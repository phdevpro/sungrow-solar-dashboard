<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sungrow Solar Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --border:    rgba(11, 11, 11, 0.10);
    --hairline:  #e1e0d9;
    --baseline:  #c3c2b7;
    --good:      #006300;
    --accent:    #eda100;
    --series:    #2a78d6;
    --meter-track: #cde2fb;
    --warn-bg:   #fff3d6;
    --warn-ink:  #6b4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --border:    rgba(255, 255, 255, 0.10);
      --hairline:  #2c2c2a;
      --baseline:  #383835;
      --good:      #0ca30c;
      --accent:    #c98500;
      --series:    #3987e5;
      --meter-track: #184f95;
      --warn-bg:   #3a2a05;
      --warn-ink:  #f2c35a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

  header.page {
    display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.5rem;
  }
  header.page h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  header.page .updated { color: var(--muted); font-size: 0.82rem; }
  .head-right { display: inline-flex; align-items: baseline; gap: 0.8rem; }
  .logout { color: var(--muted); font-size: 0.78rem; text-decoration: none; }
  .logout:hover { color: var(--ink-2); text-decoration: underline; }
  .wx-now { font-size: 0.95rem; color: var(--ink-2); }
  .wx-now .ico { font-size: 1.15rem; margin-right: 0.25rem; }

  .plant { margin-bottom: 2.5rem; }
  .plant-head { margin-bottom: 1rem; }
  .plant-head .name-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .plant-head h2 { font-size: 1.1rem; margin: 0; }
  .plant-head .loc { color: var(--ink-2); font-size: 0.85rem; margin-top: 0.15rem; }
  .pill {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.75rem; color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.6rem;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

  .kpi-grid {
    display: grid; gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    grid-template-columns: repeat(6, 1fr);
  }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--surface); padding: 1rem 1.1rem 1.05rem; }
  .tile .label { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.3rem; }
  .tile .value { font-size: 1.45rem; font-weight: 600; line-height: 1.15; }
  .tile .unit { font-size: 0.85rem; font-weight: 500; color: var(--ink-2); margin-left: 0.25rem; }
  .tile.hero { grid-column: span 2; }
  .tile.hero .value { font-size: 2.6rem; letter-spacing: -0.02em; }
  .tile.hero .label::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); margin-right: 0.4rem;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; margin-top: 1.25rem;
  }
  .card > h3 {
    font-size: 0.85rem; font-weight: 600; color: var(--ink-2);
    margin: 0; padding: 0.8rem 1.1rem; border-bottom: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  }
  .card > h3 .sub { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
  .card-body { padding: 1rem 1.1rem; }

  /* Chart controls */
  .chart-controls {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: 0.6rem 1.1rem; border-bottom: 1px solid var(--hairline); flex-wrap: wrap;
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    padding: 0.3rem 0.9rem; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-size: 0.82rem; cursor: pointer;
  }
  .seg button.on { background: var(--series); color: #fff; font-weight: 600; }
  .nav { display: inline-flex; align-items: center; gap: 0.5rem; }
  .nav-btn {
    width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--ink-2); font-size: 1rem; cursor: pointer; line-height: 1;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .date-label { font-size: 0.85rem; font-weight: 600; min-width: 7.5rem; text-align: center; }
  .date-input { border: 1px solid var(--border); border-radius: 8px; background: transparent;
    color: var(--ink-2); font: inherit; font-size: 0.8rem; padding: 0.2rem 0.4rem; }
  .legend { display: flex; gap: 1.1rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .legend span { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: var(--ink-2); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Production chart */
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.3rem 0.6rem; font-size: 0.78rem; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); transform: translate(-50%, -130%);
  }
  .chart-tip .v { font-weight: 600; }

  /* Energy flow */
  .flow-today {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 0.5rem 1rem;
    margin-top: 0.6rem; padding-top: 0.7rem; border-top: 1px solid var(--hairline);
  }
  .flow-today span { display: block; color: var(--muted); font-size: 0.75rem; }
  .flow-today b { display: block; color: var(--ink); font-weight: 600; font-size: 0.95rem; }
  .flow-svg { display: block; width: 100%; height: auto; max-width: 720px; margin: 0 auto; }
  .chart-wrap svg.flow-svg.portrait { max-width: 440px; }

  /* Panel grid */
  .panel-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  @media (max-width: 700px) { .panel-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; } }
  .panel {
    border-radius: 8px; padding: 0.5rem 0.6rem; min-height: 58px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--border);
  }
  .panel .n { font-size: 0.68rem; opacity: 0.75; }
  .panel .w { font-size: 0.92rem; font-weight: 600; }
  .panel.dead { border: 1px dashed #ec835a; color: var(--ink-2); }
  .panel.dead .w { font-size: 0.78rem; font-weight: 600; color: #ec835a; }
  .deduced-note {
    color: var(--muted); font-size: 0.78rem; margin-bottom: 0.9rem;
    border-left: 3px solid var(--accent); padding-left: 0.7rem;
  }
  .deduced-note b { color: var(--ink-2); }
  .string-group { margin-bottom: 1rem; }
  .string-group:last-child { margin-bottom: 0; }
  .string-head { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.5rem; }

  /* Batteries */
  .batt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  @media (max-width: 900px) { .batt-grid { grid-template-columns: repeat(2, 1fr); } }
  .batt { border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 0.9rem; }
  .batt .name { font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; }
  .batt .soc-row { display: flex; align-items: baseline; gap: 0.4rem; }
  .batt .soc { font-size: 1.35rem; font-weight: 600; }
  .batt .pct { color: var(--ink-2); font-size: 0.8rem; }
  .meter {
    height: 6px; border-radius: 3px; background: var(--meter-track);
    margin: 0.45rem 0 0.55rem; overflow: hidden;
  }
  .meter .fill { height: 100%; border-radius: 3px; background: var(--series); }
  .batt .meta { color: var(--muted); font-size: 0.72rem; line-height: 1.6; }
  .stored { color: var(--ink-2); font-size: 0.8rem; margin-bottom: 0.35rem; }

  /* Appliances */
  .appl-row {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: 0.6rem 0; border-bottom: 1px solid var(--hairline); flex-wrap: wrap;
  }
  .appl-row:last-child { border-bottom: none; }
  .appl-info .name { font-weight: 600; font-size: 0.92rem; }
  .appl-info .meta { color: var(--muted); font-size: 0.78rem; }
  .btn {
    padding: 0.45rem 0.95rem; border: 0; border-radius: 8px; font: inherit;
    font-size: 0.85rem; font-weight: 600; background: var(--series); color: #fff; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--border); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .ac-ctrl { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .ac-ctrl select {
    padding: 0.4rem 0.5rem; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: 0.85rem; background: var(--surface); color: var(--ink);
  }
  .ac-ctrl .sp { min-width: 3.6rem; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ac-ctrl .btn.step { padding: 0.45rem 0.7rem; }
  .auto-toggle { color: var(--ink-2); font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem; }
  .batt-system {
    display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
    padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--hairline);
  }
  .batt-system .big { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.01em; }
  .batt-system .label { color: var(--muted); font-size: 0.75rem; }
  .batt-system .meter { width: 220px; max-width: 100%; margin: 0.4rem 0 0; }

  /* Devices table */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    text-align: left; color: var(--muted); font-weight: 500; font-size: 0.75rem;
    padding: 0.55rem 1.1rem; border-bottom: 1px solid var(--hairline);
  }
  td { padding: 0.55rem 1.1rem; border-bottom: 1px solid var(--hairline); }
  tr:last-child td { border-bottom: none; }
  td.sn { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .status { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--ink-2); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .status.off .dot { background: var(--muted); }

  /* Sections */
  .tabs {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 1.25rem;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  }
  .tabs button {
    min-height: 40px; padding: 0 1rem; border: 0; border-radius: 9px; background: transparent;
    color: var(--ink-2); font: inherit; font-size: 0.9rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.45rem;
  }
  .tabs button[aria-current="page"] { background: var(--ink); color: var(--page); font-weight: 600; }
  .tabs .badge {
    min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--accent);
    color: #0b0b0b; font-size: 0.7rem; font-weight: 700; line-height: 18px; text-align: center;
  }
  .tabs .badge:empty { display: none; }
  section[hidden] { display: none; }
  section > .card:first-child, .cols > .card, .col > .card:first-child { margin-top: 0; }
  section > * + * { margin-top: 1.25rem; }
  .cols { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
  .cols > .wide { flex: 999 1 560px; min-width: 0; }
  .cols > .col { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 1.25rem; }
  .cols > .half { flex: 1 1 360px; min-width: 0; }
  .col > .card { margin-top: 0; }
  .kpi-grid.side { grid-template-columns: repeat(2, 1fr); }
  .kpi-grid.side .tile.hero { grid-column: span 2; }
  .sum-row { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; padding: 0.3rem 0; }
  .sum-row span:last-child { color: var(--ink-2); text-align: right; }
  .linkish { border: 0; background: none; color: var(--series); font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 0; }
  .attn { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0.6rem; }
  .attn-item { padding: 0.7rem 0.85rem; border-radius: 10px; background: var(--warn-bg); font-size: 0.85rem; }
  .attn-item b { color: var(--warn-ink); display: block; }
  .attn-item.info { background: var(--page); border: 1px solid var(--border); }
  .attn-item.info b { color: var(--ink); }
  .ok-note { color: var(--muted); font-size: 0.85rem; }
  /* Refresh states: content stays while updating; stale data is greyed. */
  .card > h3 .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--series);
    display: inline-block; margin-left: 0.4rem; vertical-align: middle; opacity: 0;
    transition: opacity 0.2s;
  }
  .card.updating > h3 .live-dot { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .stale-badge {
    font-size: 0.7rem; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg);
    padding: 0.1rem 0.5rem; border-radius: 999px; white-space: nowrap;
  }
  .card.stale .card-body, .card.stale .table-scroll { opacity: 0.55; }
  .skel { height: 120px; border-radius: 8px; background: var(--hairline); animation: pulse 1.4s ease-in-out infinite; }
  .plant-select { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 0.8rem; padding: 0.2rem 0.4rem; }
  header.page .sub-line { color: var(--muted); font-size: 0.82rem; margin-top: 0.15rem; }
  header.page .live { display: inline-flex; align-items: center; gap: 0.4rem; }
  header.page .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  header.page .live.paused .dot, header.page .live.late .dot { background: var(--accent); }

  /* Phone: use the width. Tighter gutters and card padding, one
     scrolling row of tabs, compact header. */
  @media (max-width: 600px) {
    body { font-size: 15px; }
    .wrap { padding: 0.9rem 0.75rem 1.5rem; }
    header.page { margin-bottom: 0.75rem; gap: 0.4rem; }
    header.page h1 { font-size: 1.1rem; }
    .head-right { flex-wrap: wrap; gap: 0.3rem 0.8rem; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-bottom: 0.75rem; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; min-height: 44px; padding: 0 0.85rem; }
    section > * + * { margin-top: 0.75rem; }
    .cols { gap: 0.75rem; }
    .cols > .col { gap: 0.75rem; }
    .card { margin-top: 0.75rem; border-radius: 12px; }
    .card > h3 { padding: 0.65rem 0.75rem; font-size: 0.9rem; }
    .card-body { padding: 0.75rem; }
    .tile { padding: 0.75rem 0.85rem; }
    .tile .label { font-size: 0.78rem; }
    .chart-controls { padding: 0.5rem 0.75rem; }
    .flow-today { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    th, td { padding: 0.5rem 0.75rem; }
    .pad { padding: 0.75rem; }
  }

  .error {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid #d03b3b;
    border-radius: 10px; padding: 0.8rem 1rem; white-space: pre-wrap; font-size: 0.9rem;
  }
  .muted { color: var(--muted); }
  .pad { padding: 1rem 1.1rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Sungrow Solar Dashboard</h1>
      <div class="sub-line" id="plant-line"></div>
    </div>
    <span class="head-right">
      <span class="wx-now" id="wx-now"></span>
      <span class="updated live" id="updated"><span class="dot"></span><span class="txt">connecting…</span></span>
      <a class="logout" href="/logout" title="Sign out">Sign out</a>
    </span>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button data-sec="overview">Overview <span class="badge" id="attn-badge"></span></button>
    <button data-sec="energy">Energy</button>
    <button data-sec="solar">Solar</button>
    <button data-sec="storage">Storage &amp; EV</button>
    <button data-sec="home">Home</button>
    <button data-sec="system">System</button>
  </nav>

  <main id="app">
    <section data-sec="overview" hidden>
      <div class="cols">
        <div class="card wide" id="card-flow">
          <h3><span>Energy flow<i class="live-dot"></i></span> <span class="sub flow-sub"></span></h3>
          <div class="card-body flow-slot"><div class="skel"></div></div>
        </div>
        <div class="col">
          <div class="kpi-grid side" id="kpi-slot"></div>
          <div class="card" id="card-homesum" hidden>
            <h3><span>Home right now</span> <button class="linkish" data-goto="home">Open</button></h3>
            <div class="card-body homesum-slot"></div>
          </div>
        </div>
      </div>
      <div class="card" id="card-attn">
        <h3><span>Needs attention</span></h3>
        <div class="card-body attn-slot"><div class="ok-note">Checking…</div></div>
      </div>
    </section>

    <section data-sec="energy" hidden>
      <div class="card" id="card-energy">
        <h3><span>Energy<i class="live-dot"></i></span> <span class="sub curve-max"></span></h3>
        <div class="chart-controls">
          <div class="seg">
            <button data-p="day">Day</button><button data-p="month">Month</button><button data-p="year">Year</button>
          </div>
          <div class="nav">
            <button class="nav-btn prev" aria-label="Previous">‹</button>
            <span class="date-label"></span>
            <button class="nav-btn next" aria-label="Next">›</button>
            <input class="date-input" type="date" aria-label="Pick date">
          </div>
        </div>
        <div class="card-body curve-slot"><div class="skel"></div></div>
      </div>
    </section>

    <section data-sec="solar" hidden>
      <div class="card" id="card-panels">
        <h3><span>Panels<i class="live-dot"></i></span> <span class="sub panels-sub"></span></h3>
        <div class="card-body panels-slot"><div class="skel"></div></div>
      </div>
    </section>

    <section data-sec="storage" hidden>
      <div class="card" id="card-batt">
        <h3><span>Battery storage<i class="live-dot"></i></span> <span class="sub batt-sub"></span></h3>
        <div class="card-body batt-slot"><div class="skel"></div></div>
      </div>
      <div class="card" id="card-ev" hidden>
        <h3><span>EV charging<i class="live-dot"></i></span> <span class="sub">Wall Connector</span></h3>
        <div class="card-body ev-slot"></div>
      </div>
    </section>

    <section data-sec="home" hidden>
      <div class="card" id="card-auto" hidden>
        <h3><span>Solar surplus automations</span> <span class="sub">checked every 5 min</span></h3>
        <div class="card-body auto-slot"></div>
      </div>
      <div id="aircon-slot"></div>
      <div id="sonoff-slot"></div>
      <div id="miele-slot"></div>
      <div class="card" id="card-home-empty" hidden>
        <div class="card-body muted">No home integrations configured (SmartThings, eWeLink or Miele).</div>
      </div>
    </section>

    <section data-sec="system" hidden>
      <div class="cols">
        <div class="card half" id="card-devices">
          <h3><span>Devices<i class="live-dot"></i></span> <span class="sub devices-sub"></span></h3>
          <div class="table-scroll devices-slot"><div class="skel" style="margin:1rem 1.1rem"></div></div>
        </div>
        <div class="card half" id="card-links">
          <h3><span>Connections</span></h3>
          <div class="card-body links-slot"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
// KPI values arrive as {value, unit} objects (e.g. {"value": "5.242", "unit": "kW"}).
const fmt = v => {
  if (v == null) return { value: "—", unit: "" };
  if (typeof v === "object") return { value: v.value ?? "—", unit: v.unit ?? "" };
  return { value: String(v), unit: "" };
};
const pct = v => v == null ? "—" : (v * 100).toFixed(1);
// Escape API-provided text (device names etc.) before putting it in innerHTML.
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function getJSON(url) {
  const r = await fetch(url);
  if (r.status === 401) { location.href = "/login"; throw new Error("Unauthorized"); }
  if (!r.ok) {
    const body = await r.text().catch(() => "");
    let detail = "";
    try { detail = JSON.parse(body).detail || ""; } catch { detail = body.slice(0, 200); }
    throw new Error(`HTTP ${r.status}${detail ? " · " + detail : ""}`);
  }
  return r.json();
}

function tile(label, v, hero = false) {
  const f = fmt(v);
  return `<div class="tile${hero ? " hero" : ""}">
    <div class="label">${label}</div>
    <div class="value">${f.value}<span class="unit">${f.unit}</span></div>
  </div>`;
}

function kpiHTML(p) {
  return `
    ${tile("Current power", p.curr_power, true)}
    ${tile("Energy today", p.today_energy)}
    ${tile("Energy total", p.total_energy)}
    ${tile("Income today", p.today_income)}
    ${tile("CO₂ saved", p.co2_reduce_total)}`;
}

/* ---------------- Weather (Open-Meteo WMO codes) ---------------- */

const WMO = [
  [[0], "☀️", "Clear sky"],
  [[1], "🌤️", "Mainly clear"],
  [[2], "⛅", "Partly cloudy"],
  [[3], "☁️", "Overcast"],
  [[45, 48], "🌫️", "Fog"],
  [[51, 53, 55, 56, 57], "🌦️", "Drizzle"],
  [[61, 63, 65, 66, 67, 80, 81, 82], "🌧️", "Rain"],
  [[71, 73, 75, 77, 85, 86], "❄️", "Snow"],
  [[95, 96, 99], "⛈️", "Thunderstorm"],
];
function wmo(code) {
  for (const [codes, ico, label] of WMO) if (codes.includes(code)) return { ico, label };
  return { ico: "•", label: "Unknown" };
}

/* ---------------- Energy chart (day / month / year) ---------------- */

// Per-plant view state, survives the 60s page refresh.
const energyState = {};
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;

function getEState(psId) {
  if (!energyState[psId]) energyState[psId] = { period: "day", date: new Date() };
  return energyState[psId];
}

function shiftDate(st, dir) {
  const d = new Date(st.date);
  if (st.period === "day") d.setDate(d.getDate() + dir);
  else if (st.period === "month") d.setMonth(d.getMonth() + dir);
  else d.setFullYear(d.getFullYear() + dir);
  if (d > new Date()) return;
  st.date = d;
}

function wireEnergyCard(el) {
  const segBtns = el.querySelectorAll(".seg button");
  const label = el.querySelector(".date-label");
  const input = el.querySelector(".date-input");
  const prev = el.querySelector(".prev"), next = el.querySelector(".next");
  const st = () => getEState(cur.psId);

  const syncControls = () => {
    const s = st();
    segBtns.forEach(b => b.classList.toggle("on", b.dataset.p === s.period));
    const d = s.date;
    if (s.period === "day") {
      label.textContent = `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
      input.type = "date";
      input.value = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      input.style.display = "";
    } else if (s.period === "month") {
      label.textContent = `${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
      input.type = "month";
      input.value = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
      input.style.display = "";
    } else {
      label.textContent = String(d.getFullYear());
      input.style.display = "none";
    }
    const now = new Date();
    next.disabled =
      (s.period === "day" && ymd(d) >= ymd(now)) ||
      (s.period === "month" && d.getFullYear() === now.getFullYear() && d.getMonth() >= now.getMonth()) ||
      (s.period === "year" && d.getFullYear() >= now.getFullYear());
  };
  energyControls.sync = syncControls;

  // A user-picked period/date replaces the chart, so show a skeleton.
  const reload = () => {
    syncControls();
    el.querySelector(".curve-slot").innerHTML = '<div class="skel"></div>';
    el.querySelector(".curve-max").textContent = "";
    bump("energy");
  };
  segBtns.forEach(b => b.addEventListener("click", () => {
    st().period = b.dataset.p; st().date = new Date(); reload();
  }));
  prev.addEventListener("click", () => { shiftDate(st(), -1); reload(); });
  next.addEventListener("click", () => { shiftDate(st(), 1); reload(); });
  input.addEventListener("change", () => {
    if (!input.value) return;
    const parts = input.value.split("-").map(Number);
    st().date = new Date(parts[0], (parts[1] ?? 1) - 1, parts[2] ?? 1);
    reload();
  });
  syncControls();
}
const energyControls = { sync: () => {} };

// Viewing the current day/month/year: the chart keeps growing, so it is
// worth refreshing. Past periods never change.
function energyIsLive(st) {
  const now = new Date(), d = st.date;
  if (st.period === "day") return ymd(d) === ymd(now);
  if (st.period === "month") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  return d.getFullYear() === now.getFullYear();
}

async function loadEnergy(slot, sub, psId, st) {
  if (st.period === "day") {
    const date = ymd(st.date);
    const [curve, flowHist, weather] = await Promise.all([
      getJSON(`/api/plants/${psId}/curve?date=${date}`),
      getJSON(`/api/plants/${psId}/flow/history?date=${date}`).catch(() => null),
      getJSON(`/api/plants/${psId}/weather?date=${date}`).catch(() => null),
    ]);
    renderDayChart(slot, sub, curve, flowHist, weather);
  } else {
    const date = st.period === "month"
      ? `${st.date.getFullYear()}${pad2(st.date.getMonth() + 1)}`
      : String(st.date.getFullYear());
    const data = await getJSON(`/api/plants/${psId}/energy?period=${st.period}&date=${date}`);
    renderAggChart(slot, sub, data, st.period);
  }
}

const DAY_SERIES = [
  { key: "pv",   label: "Solar",   color: "#eda100" },
  { key: "load", label: "Home",    color: "#3987e5" },
  { key: "grid", label: "Grid (+import / −export)",    color: "#9085e9" },
  { key: "batt", label: "Battery (+charge / −discharge)", color: "#2a9d5c" },
];

function renderDayChart(container, sub, curve, flowHist, weather) {
  const pvSamples = curve?.samples || [];
  const flowSamples = flowHist?.samples || [];
  if (!pvSamples.length && !flowSamples.length) {
    container.innerHTML = '<div class="muted">No data for this day.</div>';
    return;
  }
  const W = 960, H = 280, m = { t: 14, r: 12, b: 26, l: 50 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const toMin = t => +t.slice(0, 2) * 60 + +t.slice(2, 4);

  // Series values indexed by minute-of-day. Grid/battery are signed.
  const byMin = {};
  const put = (t, key, v) => {
    if (v == null) return;
    const x = toMin(t);
    (byMin[x] = byMin[x] || { x })[key] = v;
  };
  pvSamples.forEach(s => put(s.t, "pv", s.w));
  flowSamples.forEach(s => {
    put(s.t, "load", s.load_w);
    put(s.t, "grid", s.grid_w);
    put(s.t, "batt", s.batt_w);
  });
  const pts = Object.values(byMin).sort((a, b) => a.x - b.x);
  const present = DAY_SERIES.filter(s => pts.some(p => p[s.key] != null));

  let hi = 100, lo = 0;
  for (const p of pts) for (const s of present) {
    const v = p[s.key];
    if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); }
  }
  const stepW = hi - lo > 4000 ? 2000 : hi - lo > 2000 ? 1000 : 500;
  const yMax = Math.ceil(hi / stepW) * stepW;
  const yMin = Math.floor(lo / stepW) * stepW;

  const X = v => m.l + (v / 1440) * iw;
  const Y = v => m.t + ih - ((v - yMin) / (yMax - yMin)) * ih;

  let grid = "", ylab = "";
  for (let v = yMin; v <= yMax; v += stepW) {
    const y = Y(v).toFixed(1);
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--hairline)" stroke-width="1"/>`;
    ylab += `<text x="${m.l - 8}" y="${+y + 3.5}" text-anchor="end" font-size="11" fill="var(--muted)">${v / 1000} kW</text>`;
  }
  let xlab = "";
  for (let h = 0; h <= 24; h += 4) {
    xlab += `<text x="${X(h * 60).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${String(h).padStart(2, "0")}:00</text>`;
  }

  // One path per series; gaps where a value is missing.
  const paths = present.map(s => {
    let d = "", pen = false;
    for (const p of pts) {
      const v = p[s.key];
      if (v == null) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${X(p.x).toFixed(1)},${Y(v).toFixed(1)}`;
      pen = true;
    }
    const area = s.key === "pv" && d
      ? `<path d="${d}L${X(pts[pts.length - 1].x).toFixed(1)},${Y(0)}L${X(pts[0].x).toFixed(1)},${Y(0)}Z" fill="${s.color}" opacity="0.08"/>` : "";
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");

  // Weather strip: one icon per 2h slot, centered under the slot it covers.
  let wxRow = "", HS = H;
  const hourly = weather?.hourly;
  if (hourly?.length) {
    HS = H + 30;
    const byHour = Object.fromEntries(hourly.map(x => [x.h, x.code]));
    for (let h = 0; h < 24; h += 2) {
      const code = byHour[h] ?? byHour[h + 1];
      if (code == null) continue;
      const { ico, label } = wmo(code);
      wxRow += `<text x="${X(h * 60 + 60).toFixed(1)}" y="${H + 18}" text-anchor="middle" font-size="14">
        <title>${String(h).padStart(2, "0")}:00–${String(h + 2).padStart(2, "0")}:00 · ${label}</title>${ico}</text>`;
    }
  }

  container.innerHTML = `
    <div class="legend">${present.map(s =>
      `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>
    <div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${HS}" role="img" aria-label="Power for the day">
      ${wxRow}
      ${grid}${ylab}${xlab}
      <line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--baseline)" stroke-width="1"/>
      ${paths}
      <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--baseline)" stroke-width="1" visibility="hidden"/>
    </svg>
    <div class="chart-tip"></div>
  </div>`;

  const wrap = container.querySelector(".chart-wrap");
  const svg = wrap.querySelector("svg");
  const tip = wrap.querySelector(".chart-tip");
  const xh = svg.querySelector(".xh");

  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) * (W / r.width);
    const minute = Math.max(0, Math.min(1440, ((mx - m.l) / iw) * 1440));
    let best = pts[0];
    for (const p of pts) if (Math.abs(p.x - minute) < Math.abs(best.x - minute)) best = p;
    const px = X(best.x);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.style.left = (px / W * r.width) + "px";
    tip.style.top = "10px";
    const hh = pad2(Math.floor(best.x / 60)), mm = pad2(best.x % 60);
    tip.innerHTML = `${hh}:${mm}` + present.map(s => best[s.key] == null ? "" :
      `<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:4px"></i>${s.label.split(" (")[0]} <span class="v">${(best[s.key] / 1000).toFixed(2)} kW</span>`).join("");
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    xh.setAttribute("visibility", "hidden");
  });

  const peak = Math.max(...pts.map(p => p.pv ?? 0), 0);
  sub.textContent = peak > 0 ? `PV peak ${(peak / 1000).toFixed(2)} kW` : "";
}

const AGG_SERIES = [
  { key: "pv",     label: "Solar",    color: "#eda100", bar: true },
  { key: "load",   label: "Home",     color: "#3987e5" },
  { key: "import", label: "Imported", color: "#e34948" },
  { key: "export", label: "Exported", color: "#9085e9" },
];

function renderAggChart(container, sub, data, period) {
  const rows = data.rows || [];
  if (!rows.length) {
    container.innerHTML = '<div class="muted">No data for this period.</div>';
    return;
  }
  const W = 960, H = 280, m = { t: 14, r: 12, b: 26, l: 50 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = rows.length;
  const band = iw / n;
  const Xc = i => m.l + band * (i + 0.5);

  let hi = 1000;
  for (const r of rows) for (const s of AGG_SERIES) hi = Math.max(hi, r[s.key] ?? 0);
  const stepWh = hi > 40000 ? 20000 : hi > 20000 ? 10000 : hi > 8000 ? 5000 : 2000;
  const yMax = Math.ceil(hi / stepWh) * stepWh;
  const Y = v => m.t + ih - (v / yMax) * ih;

  let grid = "", ylab = "";
  for (let v = 0; v <= yMax; v += stepWh) {
    const y = Y(v).toFixed(1);
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--hairline)" stroke-width="1"/>`;
    ylab += `<text x="${m.l - 8}" y="${+y + 3.5}" text-anchor="end" font-size="11" fill="var(--muted)">${v / 1000} kWh</text>`;
  }
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const lab = t => period === "year" ? monthNames[+t - 1] : String(+t);
  const xEvery = period === "year" ? 1 : Math.ceil(n / 16);
  let xlab = "";
  rows.forEach((r, i) => {
    if (i % xEvery === 0) xlab += `<text x="${Xc(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab(r.t)}</text>`;
  });

  const barW = Math.min(24, band * 0.55);
  const bars = rows.map((r, i) => {
    const v = r.pv ?? 0;
    if (v <= 0) return "";
    const y = Y(v);
    return `<rect x="${(Xc(i) - barW / 2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${barW.toFixed(1)}" height="${(Y(0) - y).toFixed(1)}" rx="3" fill="#eda100"/>`;
  }).join("");

  const lines = AGG_SERIES.filter(s => !s.bar).map(s => {
    let d = "", pen = false;
    rows.forEach((r, i) => {
      const v = r[s.key];
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${Xc(i).toFixed(1)},${Y(v).toFixed(1)}`;
      pen = true;
    });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");

  container.innerHTML = `
    <div class="legend">${AGG_SERIES.map(s =>
      `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>
    <div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Energy per ${period === "year" ? "month" : "day"}">
      ${grid}${ylab}${xlab}
      <line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--baseline)" stroke-width="1"/>
      ${bars}${lines}
      <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--baseline)" stroke-width="1" visibility="hidden"/>
    </svg>
    <div class="chart-tip"></div>
  </div>`;

  const wrap = container.querySelector(".chart-wrap");
  const svg = wrap.querySelector("svg");
  const tip = wrap.querySelector(".chart-tip");
  const xh = svg.querySelector(".xh");
  const kwh = v => v == null ? "—" : (v / 1000).toFixed(1) + " kWh";

  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, Math.floor((mx - m.l) / band)));
    const row = rows[i];
    const px = Xc(i);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.style.left = (px / W * r.width) + "px";
    tip.style.top = "10px";
    tip.innerHTML = `<b>${period === "year" ? monthNames[+row.t - 1] : "Day " + +row.t}</b>` +
      AGG_SERIES.map(s => `<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:4px"></i>${s.label} <span class="v">${kwh(row[s.key])}</span>`).join("") +
      `<br>Battery: +${kwh(row.batt_charge)} / −${kwh(row.batt_discharge)}`;
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    xh.setAttribute("visibility", "hidden");
  });

  const tot = k => rows.reduce((a, r) => a + (r[k] ?? 0), 0);
  sub.textContent = `PV ${(tot("pv") / 1000).toFixed(0)} kWh · home ${(tot("load") / 1000).toFixed(0)} kWh · imported ${(tot("import") / 1000).toFixed(0)} kWh · exported ${(tot("export") / 1000).toFixed(0)} kWh`;
}

/* ---------------- Energy flow ---------------- */

const fmtW2 = w => w == null ? "—" : (Math.abs(w) >= 1000 ? (w / 1000).toFixed(2) + " kW" : Math.round(w) + " W");
const fmtKWh = wh => wh == null ? "—" : (wh / 1000).toFixed(1) + " kWh";

function renderFlow(container, sub, f, ev) {
  const soc = f.soc == null ? "—" : (f.soc * 100).toFixed(0) + "%";
  sub.textContent = `battery ${soc}`;
  const evOn = ev && ev.charging && (ev.power_w ?? 0) > 15;

  const pv = Math.max(f.pv_w ?? 0, 0), load = Math.max(f.load_w ?? 0, 0);
  const chg = Math.max(f.batt_charge_w ?? 0, 0), dis = Math.max(f.batt_discharge_w ?? 0, 0);
  const imp = Math.max(f.grid_import_w ?? 0, 0), exp = Math.max(f.grid_export_w ?? 0, 0);

  // Pair-flow split (the API only gives node totals): PV feeds the house
  // first, surplus charges the battery, remainder exports; deficits are
  // covered by battery, then grid.
  const pvToLoad = Math.min(pv, load);
  let pvRem = pv - pvToLoad;
  const pvToBatt = Math.min(pvRem, chg);
  pvRem -= pvToBatt;
  const pvToGrid = Math.min(pvRem, exp);
  const battToLoad = Math.min(dis, load - pvToLoad);
  const gridToLoad = Math.max(load - pvToLoad - battToLoad, 0) > 15 ? Math.min(imp, load - pvToLoad - battToLoad) : 0;
  const gridToBatt = Math.max(chg - pvToBatt, 0);
  const battToGrid = Math.max(exp - pvToGrid, 0);

  // Diamond layout: solar top, grid left, home right, battery bottom;
  // EV below Home when a wall connector reports. All paths are
  // quarter-curves meeting at the center. Narrow cards (phones) get a
  // portrait geometry drawn near 1:1, so the text stays readable instead
  // of the wide drawing being shrunk to ~40%.
  const portrait = container.clientWidth > 0 && container.clientWidth < 520;
  container.dataset.portrait = portrait ? "1" : "";
  const L = portrait
    ? { W: 336, H: 430, r: 40, S: { x: 168, y: 66 }, G: { x: 52, y: 200 }, H_: { x: 284, y: 200 },
        B: { x: 168, y: 346 }, EV: { x: 284, y: 346 }, val: 15, lab: 13, sub: 12, ico: 20, dot: 5, stroke: 2.5 }
    : { W: 700, H: ev ? 420 : 400, r: 38, S: { x: 350, y: 62 }, G: { x: 96, y: 185 }, H_: { x: 604, y: 185 },
        B: { x: 350, y: 308 }, EV: { x: 604, y: 330 }, val: 12.5, lab: 11.5, sub: 10.5, ico: 20, dot: 4.5, stroke: 2 };
  const { S, G, B, EV } = L, H = L.H_, gap = L.r + 6, my = G.y;
  const CLR = { sun: "#eda100", batt: "#2a9d5c", grid: "#9085e9", home: "#3987e5", ev: "#e34948" };

  const sTop = S.y + gap, bTop = B.y - gap, gR = G.x + gap, hL = H.x - gap;
  const flows = [
    ...(ev ? [{ w: evOn ? ev.power_w : 0, path: `M ${H.x} ${H.y + gap} L ${EV.x} ${EV.y - gap}`, color: CLR.ev }] : []),
    { w: pvToLoad,   path: `M ${S.x} ${sTop} C ${S.x} ${my}, ${S.x} ${my}, ${hL} ${my}`, color: CLR.sun },
    { w: pvToBatt,   path: `M ${S.x} ${sTop} L ${B.x} ${bTop}`,                         color: CLR.sun },
    { w: pvToGrid,   path: `M ${S.x} ${sTop} C ${S.x} ${my}, ${S.x} ${my}, ${gR} ${my}`, color: CLR.sun },
    { w: battToLoad, path: `M ${B.x} ${bTop} C ${B.x} ${my}, ${B.x} ${my}, ${hL} ${my}`, color: CLR.batt },
    { w: battToGrid, path: `M ${B.x} ${bTop} C ${B.x} ${my}, ${B.x} ${my}, ${gR} ${my}`, color: CLR.batt },
    { w: gridToLoad, path: `M ${gR} ${my} L ${hL} ${my}`,                               color: CLR.grid },
    { w: gridToBatt, path: `M ${gR} ${my} C ${B.x} ${my}, ${B.x} ${my}, ${B.x} ${bTop}`, color: CLR.grid },
  ];

  const paths = flows.map((e, i) => {
    const on = e.w > 15;
    // Dot speed scales with power: 0.5 kW ≈ 4s per lap, 5 kW ≈ 1.2s.
    const dur = Math.max(1.2, Math.min(5, 2200 / Math.max(e.w, 80))).toFixed(2);
    const base = `<path d="${e.path}" fill="none" stroke="${on ? e.color : "var(--hairline)"}"
      stroke-width="${on ? L.stroke : 1.5}" opacity="${on ? 0.55 : 0.6}" stroke-linecap="round"/>`;
    if (!on) return base;
    const dots = [0, 1, 2].map(k => `<circle r="${L.dot}" fill="${e.color}">
      <animateMotion dur="${dur}s" begin="${(-dur * k / 3).toFixed(2)}s" repeatCount="indefinite" path="${e.path}"/>
    </circle>`).join("");
    return base + dots;
  }).join("");

  const battState = chg - dis > 15 ? "Charging" : dis - chg > 15 ? "Discharging" : "Standby";
  const gridState = imp - exp > 15 ? "Importing" : exp - imp > 15 ? "Exporting" : "Standby";

  const node = (n, ico, color, value, l1, l2, labelAbove) => `
    <circle cx="${n.x}" cy="${n.y}" r="${L.r}" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/>
    <text x="${n.x}" y="${n.y - 4}" text-anchor="middle" font-size="${L.ico}">${ico}</text>
    <text x="${n.x}" y="${n.y + L.r * 0.5 + 1}" text-anchor="middle" font-size="${L.val}" font-weight="700" fill="var(--ink)">${value}</text>
    ${labelAbove
      ? `<text x="${n.x}" y="${n.y - L.r - 12}" text-anchor="middle" font-size="${L.lab}" font-weight="600" fill="var(--ink-2)">${l1}</text>`
      : `<text x="${n.x}" y="${n.y + L.r + 20}" text-anchor="middle" font-size="${L.lab}" font-weight="600" fill="var(--ink-2)">${l1}</text>
         ${l2 ? `<text x="${n.x}" y="${n.y + L.r + 36}" text-anchor="middle" font-size="${L.sub}" fill="var(--muted)">${l2}</text>` : ""}`}`;

  const t = f.today || {};
  const evState = !ev ? "" : evOn ? "Charging" : ev.vehicle_connected ? "Plugged in" : "Disconnected";
  const stat = (label, v) => `<div><span>${label}</span><b>${v}</b></div>`;
  container.innerHTML = `
    <div class="chart-wrap">
      <svg class="flow-svg${portrait ? " portrait" : ""}" viewBox="0 0 ${L.W} ${L.H}" role="img" aria-label="Energy flow">
        ${paths}
        ${node(S, "☀️", CLR.sun, fmtW2(pv), "Solar", "", true)}
        ${node(G, "⚡", CLR.grid, fmtW2(Math.abs(imp - exp)), "Grid", gridState)}
        ${node(H, "🏠", CLR.home, fmtW2(load), "Home", "", !!ev)}
        ${node(B, "🔋", CLR.batt, fmtW2(Math.abs(chg - dis)), `Battery ${soc}`, battState)}
        ${ev ? node(EV, "🚗", CLR.ev, evOn ? fmtW2(ev.power_w) : "0 W", "EV", evState) : ""}
      </svg>
    </div>
    <div class="flow-today">
      ${stat("Solar today", fmtKWh(t.pv_wh))}
      ${stat("Home", fmtKWh(t.load_wh))}
      ${stat("Exported", fmtKWh(t.export_wh))}
      ${stat("Imported", fmtKWh(t.import_wh))}
      ${stat("Charged", fmtKWh(t.batt_charge_wh))}
      ${stat("Discharged", fmtKWh(t.batt_discharge_wh))}
      ${ev?.session_wh != null ? stat("EV session", fmtKWh(ev.session_wh)) : ""}
    </div>`;
  if (lastFlow.args?.[0] !== container) flowObserver.observe(container);
  lastFlow.args = [container, sub, f, ev];
}

// Redraw the flow when the card crosses the portrait/landscape width
// (phone rotation, window resize) without waiting for the next poll.
const lastFlow = { args: null };
// Also run when the Overview tab is shown: drawn while hidden, the card
// had no width to measure.
function syncFlowLayout() {
  const a = lastFlow.args;
  if (!a || !a[0].isConnected || !a[0].clientWidth) return;
  const want = a[0].clientWidth < 520 ? "1" : "";
  if (want !== (a[0].dataset.portrait || "")) renderFlow(...a);
}
let flowResizeTimer;
const flowObserver = new ResizeObserver(() => {
  clearTimeout(flowResizeTimer);
  flowResizeTimer = setTimeout(syncFlowLayout, 150);
});

/* ---------------- Panels (optimizers) ---------------- */

// Sequential blue ramp, light→dark (light-mode steps / dark-mode steps).
const RAMP_LIGHT = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95"];
const RAMP_DARK  = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#3987e5"];
const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches;

function panelTile(p, i, max, ramp) {
  const w = p.power_w;
  // No device_time at all = the optimizer has never reported to the cloud.
  if (!p.reporting) {
    return `<div class="panel dead"
      title="Panel ${i + 1} · SN ${p.sn ?? "?"} · optimizer is not communicating: no data has ever been received from this unit. Check wiring/pairing or contact the installer.">
      <span class="n">#${i + 1}</span>
      <span class="w">⚠ No data</span>
    </div>`;
  }
  const frac = w == null ? 0 : w / max;
  const idx = Math.min(ramp.length - 1, Math.floor(frac * ramp.length));
  const bg = w == null ? "transparent" : ramp[idx];
  // Ink flips by step luminance: light-mode steps 0-2 are light fills, dark-mode steps 3+ approach mid-blue.
  const dark = isDark() ? idx >= ramp.length : idx >= 3;
  const ink = w == null ? "var(--muted)" : (isDark() ? "#ffffff" : (dark ? "#ffffff" : "#0b0b0b"));
  const kwh = p.total_wh == null ? "—" : (p.total_wh / 1000).toFixed(1);
  const lowConf = p._conf != null && p._conf < 0.1;
  const conf = p._conf != null
    ? ` · string confidence ${p._conf}${lowConf ? " (low — assignment uncertain)" : ""}` : "";
  return `<div class="panel" style="background:${bg};color:${ink}"
    title="Panel ${i + 1} · SN ${p.sn ?? "?"} · now ${w == null ? "—" : w.toFixed(0)} W · lifetime ${kwh} kWh${conf}">
    <span class="n">#${i + 1}${lowConf ? " ≈" : ""}</span>
    <span class="w">${w == null ? "—" : w.toFixed(0)} W</span>
  </div>`;
}

function renderPanels(container, sub, data, strMap) {
  const panels = data.panels || [];
  if (!panels.length) {
    container.innerHTML = '<div class="muted">No optimizers found.</div>';
    return;
  }
  const ramp = isDark() ? RAMP_DARK : RAMP_LIGHT;
  const max = Math.max(...panels.map(p => p.power_w ?? 0), 1);
  const total = panels.reduce((a, p) => a + (p.power_w ?? 0), 0);
  const dead = panels.filter(p => !p.reporting).length;
  sub.textContent = `${panels.length} optimizers · ${(total / 1000).toFixed(2)} kW now`
    + (dead ? ` · ⚠ ${dead} not communicating` : "");

  // Attach the deduced string (if the mapping endpoint returned one).
  const byKey = {};
  (strMap?.panels || []).forEach(m => { byKey[m.ps_key] = m; });
  panels.forEach(p => {
    const m = byKey[p.ps_key];
    p._string = m?.string ?? null;
    p._conf = m?.confidence ?? null;
  });

  if (!strMap) {
    container.innerHTML = `<div class="panel-grid">
      ${panels.map((p, i) => panelTile(p, i, max, ramp)).join("")}
    </div>`;
    return;
  }

  const groups = [
    { label: "String A · MPPT1", panels: [] },
    { label: "String B · MPPT2", panels: [] },
    { label: "Unassigned", panels: [] },
  ];
  panels.forEach((p, i) => {
    const g = p._string === 1 ? 0 : p._string === 2 ? 1 : 2;
    groups[g].panels.push([p, i]);
  });

  container.innerHTML = `
    <div class="deduced-note">String grouping is <b>deduced</b> by correlating each
      panel's power curve with the inverter's two MPPT inputs
      (data from ${strMap.date?.slice(6)}/${strMap.date?.slice(4, 6)}) — the API does not expose the actual wiring.
      Panels marked "≈" have low confidence. Recomputed daily.</div>
    ${groups.filter(g => g.panels.length).map(g => `
      <div class="string-group">
        <div class="string-head">${g.label}
          <span class="muted">· ${g.panels.length} panels
          · ${(g.panels.reduce((a, [p]) => a + (p.power_w ?? 0), 0) / 1000).toFixed(2)} kW now</span></div>
        <div class="panel-grid">
          ${g.panels.map(([p, i]) => panelTile(p, i, max, ramp)).join("")}
        </div>
      </div>`).join("")}`;
}

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body ?? {}),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
  return r.json();
}

      ctl.title = e.message;

  };
  el.querySelectorAll(".appl-row[data-id]").forEach(row => {
    const d = devices.find(x => x.id === row.dataset.id);

      send(row, { on: d.switch !== "on" }, e.currentTarget));
    row.querySelector(".ac-mode").addEventListener("change", e =>
      send(row, { mode: e.currentTarget.value }, e.currentTarget));
    row.querySelectorAll(".step").forEach(b => b.addEventListener("click", () => {
      if (d.setpoint_c == null) return;
      // Whole degrees only: the units reject decimal setpoints.
      d.setpoint_c = Math.min(30, Math.max(16, Math.round(d.setpoint_c) + Number(b.dataset.step)));
      row.querySelector(".sp").textContent = d.setpoint_c + "°";
      // Debounce: send once the user stops tapping.
      clearTimeout(row._spTimer);
      el.dataset.hold = "1";
      row._spTimer = setTimeout(() => {
        delete el.dataset.hold;
        send(row, { setpoint: d.setpoint_c }, b);
      }, 800);
    }));
  });
}

function renderAutomations() {
  const card = document.getElementById("card-auto");
  const ac = home.aircon, mi = home.miele;
  const kw = w => (w / 1000).toFixed(1) + " kW";
  const items = [];
  if (mi?.connected) items.push({
    key: "miele", on: mi.auto, title: "1 · Miele appliances",
    text: `Start a programmed appliance when more than ${kw(mi.surplus_w)} is being exported${mi.min_soc ? ` and battery ≥ ${Math.round(mi.min_soc * 100)}%` : ""}.`,
  });
  if (ac?.connected) items.push({
    key: "ac", on: ac.auto, title: `${mi?.connected ? "2" : "1"} · Air conditioning`,
    text: `When more than ${kw(ac.surplus_w)} is being exported, switch on the next unit in the order below (one every 10 min). Switch off the lowest-priority unit it started once the ACs take more than ${ac.stop_w} W the battery could absorb (it charges up to ~${kw(ac.batt_max_w)}) or that comes from grid/battery, for 10 min.`,
    units: true,
  });
  card.hidden = !items.length;
  const slot = card.querySelector(".auto-slot");
  if (slot.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;

  // Opted-in units first in priority order, then the others.
  const order = ac?.order || [];
  const units = ac?.connected ? [
    ...order.map(id => ac.devices.find(d => d.id === id)).filter(Boolean),
    ...ac.devices.filter(d => !order.includes(d.id)),
  ] : [];
  const unitList = () => `<div style="margin-top:0.6rem">${units.map(d => {
    const n = order.indexOf(d.id);
    return `<div class="sum-row" style="align-items:center" data-unit="${esc(d.id)}">
      <label style="display:inline-flex;gap:0.5rem;align-items:center;cursor:pointer">
        <input type="checkbox" data-use ${n >= 0 ? "checked" : ""} style="width:18px;height:18px">
        <span>${n >= 0 ? `<b style="display:inline;color:var(--ink)">${n + 1}.</b> ` : ""}${esc(d.name)}</span>
      </label>
      <span style="display:inline-flex;gap:0.3rem">${n >= 0 ? `
        <button class="btn ghost step" data-move="-1" ${n === 0 ? "disabled" : ""} aria-label="Higher priority">▲</button>
        <button class="btn ghost step" data-move="1" ${n === order.length - 1 ? "disabled" : ""} aria-label="Lower priority">▼</button>` : `<span class="muted">not used</span>`}
      </span>
    </div>`;
  }).join("")}</div>`;

  slot.innerHTML = `<div class="attn">${items.map(i => `
    <div class="attn-item info">
      <label style="display:flex;gap:0.7rem;align-items:flex-start;cursor:pointer">
        <input type="checkbox" data-auto="${i.key}" ${i.on ? "checked" : ""} style="width:18px;height:18px;margin:0.1rem 0 0">
        <span><b>${i.title}</b><span class="muted">${esc(i.text)}</span></span>
      </label>
      ${i.units ? unitList() : ""}
    </div>`).join("")}</div>`;

  slot.querySelectorAll("input[data-auto]").forEach(cb => cb.addEventListener("change", () => {
    const url = cb.dataset.auto === "ac" ? "/api/aircon-auto" : "/api/miele/auto";
    postJSON(url, { enabled: cb.checked })
      .then(() => bump(cb.dataset.auto === "ac" ? "aircon" : "miele"))
      .catch(e => { cb.checked = !cb.checked; alert(e.message); });
  }));
  const saveOrder = next => {
    ac.order = next;  // optimistic, so the list redraws at once
    renderAutomations();
    postJSON("/api/aircon-auto", { order: next })
      .then(() => bump("aircon"))
      .catch(e => { alert(e.message); bump("aircon"); });
  };
  slot.querySelectorAll("[data-unit]").forEach(row => {
    const id = row.dataset.unit;
    row.querySelector("input[data-use]").addEventListener("change", e =>
      saveOrder(e.target.checked ? [...order, id] : order.filter(x => x !== id)));
    row.querySelectorAll("[data-move]").forEach(b => b.addEventListener("click", () => {
      const i = order.indexOf(id), j = i + Number(b.dataset.move);
      const next = [...order];
      [next[i], next[j]] = [next[j], next[i]];
      saveOrder(next);
    }));
  });
}

const lastPanels = { data: null };

function renderAttention() {
  const items = [];
  const dead = (lastPanels.data?.panels || [])
    .map((p, i) => ({ p, i })).filter(x => !x.p.reporting);
  for (const { p, i } of dead) items.push({
    warn: true, title: `Optimizer #${i + 1} is not reporting`,
    text: `SN ${p.sn ?? "?"} · no data received from this unit. Check wiring/pairing or contact the installer.`,
  });
  const names = { aircon: ["SmartThings", "/api/smartthings/login"], sonoff: ["eWeLink", "/api/ewelink/login"], miele: ["Miele", "/api/miele/login"] };
  for (const [k, [name, url]] of Object.entries(names)) {
    if (home[k] && home[k].connected === false) items.push({
      warn: false, title: `${name} not connected`,
      html: `<a href="${url}">Connect ${name} account</a>`,
    });
  }
  for (const L of Object.values(loaders)) {
    if (L.error && L.ok === 0 && L.name !== "devices") items.push({
      warn: true, title: `${L.label} unavailable`, text: L.error,
    });
  }
  document.getElementById("attn-badge").textContent = items.filter(i => i.warn).length || "";
  document.querySelector("#card-attn .attn-slot").innerHTML = items.length
    ? `<div class="attn">${items.map(i => `<div class="attn-item${i.warn ? "" : " info"}">
        <b>${esc(i.title)}</b>${i.html ?? esc(i.text)}</div>`).join("")}</div>`
    : '<div class="ok-note">All systems reporting.</div>';
}

function renderLinks() {
  const ago = ts => {
    if (!ts) return "never";
    const s = Math.round((Date.now() - ts) / 1000);
    return s < 90 ? `${s}s ago` : `${Math.round(s / 60)} min ago`;
  };
  const rows = [["iSolarCloud", loaders.plants.ok ? `Connected · ${ago(loaders.plants.ok)}` : (loaders.plants.error || "Connecting…")]];
  const names = { aircon: "SmartThings", sonoff: "eWeLink", miele: "Miele" };
  for (const [k, name] of Object.entries(names)) {
    const d = home[k];
    rows.push([name, d === null ? "Not configured" : d === undefined ? "…" : d.connected ? "Connected" : "Not connected"]);
  }
  const ev = loaders.ev;
  rows.push(["Wall Connector", ev.disabled ? "No data" : ev.ok ? `Reporting · ${ago(ev.ok)}` : "…"]);
  document.querySelector("#card-links .links-slot").innerHTML = rows.map(([k, v]) =>
    `<div class="sum-row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("");
}

/* ---------------- Refresh scheduler ----------------
   The page shell is built once. Each card has a loader with its own
   interval; only loaders for the open section (plus "*" ones) run, the
   browser tab being hidden pauses everything, and a failed fetch keeps
   the card's last content and marks it stale instead of wiping it. */

const cur = { psId: null, plant: null, plants: [], sec: "overview" };
const loaders = {};
const S = 1000, MIN = 60 * S;

function defLoader(name, opts) {
  loaders[name] = { name, last: 0, ok: 0, busy: false, error: null, disabled: false, ...opts };
}

const cardEl = L => L.card ? document.getElementById(L.card) : null;

// Don't re-render a card while someone is using a control in it.
function isInteracting(card) {
  if (!card) return false;
  if (card.querySelector("[data-hold]") || card.dataset.hold) return true;
  const a = document.activeElement;
  return !!a && card.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
}

function setStale(card, L) {
  if (!card) return;
  const h = card.matches(".card") ? card : card.querySelector(".card");
  if (!h) return;
  const head = h.querySelector(":scope > h3");
  let badge = head?.querySelector(".stale-badge");
  if (L.error && L.ok) {
    h.classList.add("stale");
    if (head && !badge) {
      badge = document.createElement("span");
      badge.className = "stale-badge";
      head.appendChild(badge);
    }
    if (badge) {
      badge.textContent = `data from ${new Date(L.ok).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      badge.title = `${L.error} · retrying`;
    }
  } else {
    h.classList.remove("stale");
    badge?.remove();
  }
}

async function runLoader(L, force = false) {
  if (L.busy || L.disabled || !cur.psId && L.needsPlant) return;
  if (!force && Date.now() - L.last < L.every) return;
  const card = cardEl(L);
  if (!force && isInteracting(card)) return;
  L.busy = true;
  const h = card?.matches(".card") ? card : card?.querySelector(".card");
  h?.classList.add("updating");
  try {
    await L.run();
    L.ok = Date.now();
    L.error = null;
  } catch (e) {
    L.error = e.message;
    // Nothing shown yet: an inline error with a retry, never a blank page.
    if (!L.ok && L.slot) {
      const slot = document.querySelector(L.slot);
      if (slot) {
        slot.innerHTML = `<div class="error">${esc(e.message)}\n<button class="btn ghost" style="margin-top:0.6rem">Try again</button></div>`;
        slot.querySelector("button").addEventListener("click", () => {
          slot.innerHTML = '<div class="skel"></div>';
          runLoader(L, true);
        });
      }
    }
  } finally {
    L.last = Date.now();
    L.busy = false;
    h?.classList.remove("updating");
    setStale(card, L);
    afterLoad();
  }
}

function afterLoad() {
  renderAttention();
  if (cur.sec === "system") renderLinks();
  renderStatus();
}

const visibleNow = L => L.sec.includes("*") || L.sec.includes(cur.sec);

function tick() {
  if (document.hidden) { renderStatus(); return; }
  for (const L of Object.values(loaders)) if (visibleNow(L)) runLoader(L);
}

// Force one loader soon (after an action, or a control change).
function bump(name, delay = 0) {
  setTimeout(() => { if (loaders[name]) runLoader(loaders[name], true); }, delay);
}

function renderStatus() {
  const el = document.getElementById("updated");
  const txt = el.querySelector(".txt");
  const ok = Math.max(loaders.flow.ok, loaders.plants.ok);
  el.classList.toggle("paused", document.hidden);
  el.classList.toggle("late", !!ok && Date.now() - ok > 3 * MIN);
  if (!ok) { txt.textContent = "connecting…"; return; }
  const t = new Date(ok).toLocaleTimeString();
  txt.textContent = document.hidden ? `paused · ${t}`
    : Date.now() - ok > 3 * MIN ? `data delayed · ${t}` : `live · ${t}`;
}

function showSection(sec) {
  if (!document.querySelector(`section[data-sec="${sec}"]`)) sec = "overview";
  cur.sec = sec;
  document.querySelectorAll("main > section").forEach(el => { el.hidden = el.dataset.sec !== sec; });
  document.querySelectorAll(".tabs button").forEach(b => {
    if (b.dataset.sec === sec) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  if (sec === "energy") energyControls.sync();
  if (sec === "overview") syncFlowLayout();
  if (sec === "system") renderLinks();
  tick();
}

document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => { location.hash = b.dataset.sec; }));
document.querySelectorAll("[data-goto]").forEach(b =>
  b.addEventListener("click", () => { location.hash = b.dataset.goto; }));
window.addEventListener("hashchange", () => showSection(location.hash.slice(1)));
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); else renderStatus(); });

// An optional integration: 404 means "not configured" → hide for good.
function integration(name, url, slotId, render) {
  return async () => {
    let data;
    try {
      data = await getJSON(url);
    } catch (e) {
      if (/^HTTP 404/.test(e.message)) {
        home[name] = null;
        loaders[name].disabled = true;
        document.getElementById("card-home-empty").hidden =
          !Object.values(home).every(v => v === null);
        renderLinks();
        return;
      }
      throw e;
    }
    home[name] = data;
    const slot = document.getElementById(slotId);
    if (!isInteracting(slot)) render(slot, data);
    renderHomeSummary();
    renderAutomations();
  };
}

function plantLine(p) {
  const online = p.ps_status === 1;
  const parts = [esc(p.ps_name ?? "Plant " + p.ps_id), esc(p.ps_location ?? ""),
    `<span class="status${online ? "" : " off"}"><span class="dot"></span>${online ? "Online" : "Offline"}</span>`];
  let select = "";
  if (cur.plants.length > 1) {
    select = `<select class="plant-select" aria-label="Plant">${cur.plants.map(x =>
      `<option value="${esc(x.ps_id)}" ${String(x.ps_id) === String(cur.psId) ? "selected" : ""}>${esc(x.ps_name ?? x.ps_id)}</option>`).join("")}</select> `;
  }
  return select + parts.filter(Boolean).join(" · ");
}

defLoader("plants", { label: "Plant data", sec: ["*"], every: 60 * S, async run() {
  const data = await getJSON("/api/plants");
  const plants = data.pageList || data.list || [];
  if (!plants.length) throw new Error("No plants found on this account.");
  cur.plants = plants;
  const saved = (() => { try { return localStorage.getItem("psId"); } catch { return null; } })();
  const p = plants.find(x => String(x.ps_id) === String(cur.psId ?? saved)) || plants[0];
  const switched = String(p.ps_id) !== String(cur.psId);
  cur.psId = p.ps_id; cur.plant = p;
  const line = document.getElementById("plant-line");
  if (!line.contains(document.activeElement)) {
    line.innerHTML = plantLine(p);
    line.querySelector("select")?.addEventListener("change", e => {
      try { localStorage.setItem("psId", e.target.value); } catch {}
      cur.psId = e.target.value;
      for (const L of Object.values(loaders)) { L.last = 0; L.ok = 0; }
      bump("plants");
    });
  }
  document.getElementById("kpi-slot").innerHTML = kpiHTML(p);
  if (switched) { for (const L of Object.values(loaders)) if (L.needsPlant) L.last = 0; setTimeout(tick, 0); }
}});

defLoader("weather", { label: "Weather", sec: ["*"], every: 30 * MIN, needsPlant: true, async run() {
  const weather = await getJSON(`/api/plants/${cur.psId}/weather`);
  if (weather?.current?.code != null) {
    const { ico, label } = wmo(weather.current.code);
    const t = weather.current.temp_c;
    document.getElementById("wx-now").innerHTML =
      `<span class="ico" title="${label}">${ico}</span>${t == null ? "" : t.toFixed(0) + " °C"}`;
  }
}});

defLoader("flow", { label: "Energy flow", sec: ["overview"], every: 60 * S, needsPlant: true,
  card: "card-flow", slot: "#card-flow .flow-slot", async run() {
  const [flow, ev] = await Promise.all([
    getJSON(`/api/plants/${cur.psId}/flow`),
    getJSON("/api/ev").catch(() => null),
  ]);
  renderFlow(document.querySelector("#card-flow .flow-slot"), document.querySelector("#card-flow .flow-sub"), flow, ev);
}});

defLoader("energy", { label: "Energy chart", sec: ["energy"], every: 5 * MIN, needsPlant: true,
  card: "card-energy", slot: "#card-energy .curve-slot", async run() {
  const st = getEState(cur.psId);
  const slot = document.querySelector("#card-energy .curve-slot");
  // Past periods are final: once drawn, no need to poll them.
  if (this.drawn === `${cur.psId}|${st.period}|${ymd(st.date)}` && !energyIsLive(st)) return;
  await loadEnergy(slot, document.querySelector("#card-energy .curve-max"), cur.psId, st);
  this.drawn = `${cur.psId}|${st.period}|${ymd(st.date)}`;
}});

// Strings mapping is recomputed daily server-side: fetch it rarely.
const stringsCache = { at: 0, data: null };
defLoader("panels", { label: "Panels", sec: ["solar", "overview"], every: 5 * MIN, needsPlant: true,
  card: "card-panels", slot: "#card-panels .panels-slot", async run() {
  const stringsP = Date.now() - stringsCache.at > 30 * MIN
    ? getJSON(`/api/plants/${cur.psId}/strings`).catch(() => null)
        .then(d => { stringsCache.at = Date.now(); stringsCache.data = d; return d; })
    : Promise.resolve(stringsCache.data);
  const [panels, strMap] = await Promise.all([getJSON(`/api/plants/${cur.psId}/panels`), stringsP]);
  lastPanels.data = panels;
  renderPanels(document.querySelector("#card-panels .panels-slot"), document.querySelector("#card-panels .panels-sub"), panels, strMap);
}});

defLoader("batt", { label: "Battery data", sec: ["storage"], every: 5 * MIN, needsPlant: true,
  card: "card-batt", slot: "#card-batt .batt-slot", async run() {
  const data = await getJSON(`/api/plants/${cur.psId}/batteries`);
  renderBatteries(document.querySelector("#card-batt .batt-slot"), document.querySelector("#card-batt .batt-sub"), data);
}});

defLoader("ev", { label: "EV charger", sec: ["storage"], every: 60 * S, card: "card-ev", async run() {
  let ev;
  try { ev = await getJSON("/api/ev"); }
  catch (e) {
    if (/^HTTP 404/.test(e.message)) { this.disabled = true; return; }
    throw e;
  }
  const card = document.getElementById("card-ev");
  card.hidden = false;
  renderEV(card.querySelector(".ev-slot"), ev);
}});

defLoader("devices", { label: "Device list", sec: ["system"], every: 30 * MIN, needsPlant: true,
  card: "card-devices", slot: "#card-devices .devices-slot", async run() {
  const data = await getJSON(`/api/plants/${cur.psId}/devices`);
  renderDevices(document.querySelector("#card-devices .devices-slot"), document.querySelector("#card-devices .devices-sub"), data, cur.plant);
}});

defLoader("aircon", { label: "Air conditioning", sec: ["home", "overview"], every: 30 * S,
  card: "aircon-slot", run: integration("aircon", "/api/aircon", "aircon-slot", renderAircon) });
defLoader("sonoff", { label: "Smart plugs", sec: ["home", "overview"], every: 30 * S,
  card: "sonoff-slot", run: integration("sonoff", "/api/ewelink/devices", "sonoff-slot", renderSonoff) });
defLoader("miele", { label: "Appliances", sec: ["home", "overview"], every: 30 * S,
  card: "miele-slot", run: integration("miele", "/api/miele/devices", "miele-slot", renderAppliances) });

wireEnergyCard(document.getElementById("card-energy"));
showSection(location.hash.slice(1) || "overview");
setInterval(tick, 5 * S);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
