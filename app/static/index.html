<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sungrow Solar Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --border:    rgba(11, 11, 11, 0.10);
    --hairline:  #e1e0d9;
    --baseline:  #c3c2b7;
    --good:      #006300;
    --accent:    #eda100;
    --series:    #2a78d6;
    --meter-track: #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --border:    rgba(255, 255, 255, 0.10);
      --hairline:  #2c2c2a;
      --baseline:  #383835;
      --good:      #0ca30c;
      --accent:    #c98500;
      --series:    #3987e5;
      --meter-track: #184f95;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

  header.page {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.5rem;
  }
  header.page h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  header.page .updated { color: var(--muted); font-size: 0.82rem; }
  .head-right { display: inline-flex; align-items: baseline; gap: 0.8rem; }
  .logout { color: var(--muted); font-size: 0.78rem; text-decoration: none; }
  .logout:hover { color: var(--ink-2); text-decoration: underline; }
  .wx-now { font-size: 0.95rem; color: var(--ink-2); }
  .wx-now .ico { font-size: 1.15rem; margin-right: 0.25rem; }

  .plant { margin-bottom: 2.5rem; }
  .plant-head { margin-bottom: 1rem; }
  .plant-head .name-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .plant-head h2 { font-size: 1.1rem; margin: 0; }
  .plant-head .loc { color: var(--ink-2); font-size: 0.85rem; margin-top: 0.15rem; }
  .pill {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.75rem; color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.6rem;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

  .kpi-grid {
    display: grid; gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    grid-template-columns: repeat(6, 1fr);
  }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--surface); padding: 1rem 1.1rem 1.05rem; }
  .tile .label { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.3rem; }
  .tile .value { font-size: 1.45rem; font-weight: 600; line-height: 1.15; }
  .tile .unit { font-size: 0.85rem; font-weight: 500; color: var(--ink-2); margin-left: 0.25rem; }
  .tile.hero { grid-column: span 2; }
  .tile.hero .value { font-size: 2.6rem; letter-spacing: -0.02em; }
  .tile.hero .label::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); margin-right: 0.4rem;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; margin-top: 1.25rem;
  }
  .card > h3 {
    font-size: 0.85rem; font-weight: 600; color: var(--ink-2);
    margin: 0; padding: 0.8rem 1.1rem; border-bottom: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  }
  .card > h3 .sub { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
  .card-body { padding: 1rem 1.1rem; }

  /* Chart controls */
  .chart-controls {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: 0.6rem 1.1rem; border-bottom: 1px solid var(--hairline); flex-wrap: wrap;
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    padding: 0.3rem 0.9rem; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-size: 0.82rem; cursor: pointer;
  }
  .seg button.on { background: var(--series); color: #fff; font-weight: 600; }
  .nav { display: inline-flex; align-items: center; gap: 0.5rem; }
  .nav-btn {
    width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--ink-2); font-size: 1rem; cursor: pointer; line-height: 1;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .date-label { font-size: 0.85rem; font-weight: 600; min-width: 7.5rem; text-align: center; }
  .date-input { border: 1px solid var(--border); border-radius: 8px; background: transparent;
    color: var(--ink-2); font: inherit; font-size: 0.8rem; padding: 0.2rem 0.4rem; }
  .legend { display: flex; gap: 1.1rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .legend span { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: var(--ink-2); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Production chart */
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.3rem 0.6rem; font-size: 0.78rem; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); transform: translate(-50%, -130%);
  }
  .chart-tip .v { font-weight: 600; }

  /* Energy flow */
  .flow-today {
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin-top: 0.6rem;
    color: var(--muted); font-size: 0.78rem;
  }
  .flow-today b { color: var(--ink-2); font-weight: 600; }

  /* Panel grid */
  .panel-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  @media (max-width: 700px) { .panel-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; } }
  .panel {
    border-radius: 8px; padding: 0.5rem 0.6rem; min-height: 58px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--border);
  }
  .panel .n { font-size: 0.68rem; opacity: 0.75; }
  .panel .w { font-size: 0.92rem; font-weight: 600; }
  .panel.dead { border: 1px dashed #ec835a; color: var(--ink-2); }
  .panel.dead .w { font-size: 0.78rem; font-weight: 600; color: #ec835a; }
  .deduced-note {
    color: var(--muted); font-size: 0.78rem; margin-bottom: 0.9rem;
    border-left: 3px solid var(--accent); padding-left: 0.7rem;
  }
  .deduced-note b { color: var(--ink-2); }
  .string-group { margin-bottom: 1rem; }
  .string-group:last-child { margin-bottom: 0; }
  .string-head { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.5rem; }

  /* Batteries */
  .batt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  @media (max-width: 900px) { .batt-grid { grid-template-columns: repeat(2, 1fr); } }
  .batt { border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 0.9rem; }
  .batt .name { font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; }
  .batt .soc-row { display: flex; align-items: baseline; gap: 0.4rem; }
  .batt .soc { font-size: 1.35rem; font-weight: 600; }
  .batt .pct { color: var(--ink-2); font-size: 0.8rem; }
  .meter {
    height: 6px; border-radius: 3px; background: var(--meter-track);
    margin: 0.45rem 0 0.55rem; overflow: hidden;
  }
  .meter .fill { height: 100%; border-radius: 3px; background: var(--series); }
  .batt .meta { color: var(--muted); font-size: 0.72rem; line-height: 1.6; }
  .stored { color: var(--ink-2); font-size: 0.8rem; margin-bottom: 0.35rem; }
  .batt-system {
    display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
    padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--hairline);
  }
  .batt-system .big { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.01em; }
  .batt-system .label { color: var(--muted); font-size: 0.75rem; }
  .batt-system .meter { width: 220px; max-width: 100%; margin: 0.4rem 0 0; }

  /* Devices table */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    text-align: left; color: var(--muted); font-weight: 500; font-size: 0.75rem;
    padding: 0.55rem 1.1rem; border-bottom: 1px solid var(--hairline);
  }
  td { padding: 0.55rem 1.1rem; border-bottom: 1px solid var(--hairline); }
  tr:last-child td { border-bottom: none; }
  td.sn { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .status { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--ink-2); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .status.off .dot { background: var(--muted); }

  .error {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid #d03b3b;
    border-radius: 10px; padding: 0.8rem 1rem; white-space: pre-wrap; font-size: 0.9rem;
  }
  .muted { color: var(--muted); }
  .pad { padding: 1rem 1.1rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>Sungrow Solar Dashboard</h1>
    <span class="head-right">
      <span class="wx-now" id="wx-now"></span>
      <span class="updated" id="updated"></span>
      <a class="logout" href="/logout" title="Sign out">Sign out</a>
    </span>
  </header>
  <main id="app" class="muted">Loading plants…</main>
</div>

<script>
// KPI values arrive as {value, unit} objects (e.g. {"value": "5.242", "unit": "kW"}).
const fmt = v => {
  if (v == null) return { value: "—", unit: "" };
  if (typeof v === "object") return { value: v.value ?? "—", unit: v.unit ?? "" };
  return { value: String(v), unit: "" };
};
const pct = v => v == null ? "—" : (v * 100).toFixed(1);

async function getJSON(url) {
  const r = await fetch(url);
  if (r.status === 401) { location.href = "/login"; throw new Error("Unauthorized"); }
  if (!r.ok) {
    const body = await r.text().catch(() => "");
    let detail = "";
    try { detail = JSON.parse(body).detail || ""; } catch { detail = body.slice(0, 200); }
    throw new Error(`HTTP ${r.status}${detail ? " · " + detail : ""}`);
  }
  return r.json();
}

function tile(label, v, hero = false) {
  const f = fmt(v);
  return `<div class="tile${hero ? " hero" : ""}">
    <div class="label">${label}</div>
    <div class="value">${f.value}<span class="unit">${f.unit}</span></div>
  </div>`;
}

function plantHTML(p) {
  const online = p.ps_status === 1;
  return `
    <div class="plant-head">
      <div class="name-row">
        <h2>${p.ps_name ?? "Plant " + p.ps_id}</h2>
        <span class="pill"><span class="dot"${online ? "" : ' style="background:var(--muted)"'}></span>${online ? "Online" : "Offline"}</span>
      </div>
      <div class="loc">${p.ps_location ?? ""}</div>
    </div>
    <div class="kpi-grid">
      ${tile("Current power", p.curr_power, true)}
      ${tile("Energy today", p.today_energy)}
      ${tile("Energy total", p.total_energy)}
      ${tile("Income today", p.today_income)}
      ${tile("CO₂ saved", p.co2_reduce_total)}
    </div>
    <div class="card">
      <h3>Energy <span class="sub curve-max"></span></h3>
      <div class="chart-controls">
        <div class="seg">
          <button data-p="day">Day</button><button data-p="month">Month</button><button data-p="year">Year</button>
        </div>
        <div class="nav">
          <button class="nav-btn prev">‹</button>
          <span class="date-label"></span>
          <button class="nav-btn next">›</button>
          <input class="date-input" type="date">
        </div>
      </div>
      <div class="card-body curve-slot"><div class="muted">Loading…</div></div>
    </div>
    <div class="card">
      <h3>Energy flow <span class="sub flow-sub"></span></h3>
      <div class="card-body flow-slot"><div class="muted">Loading…</div></div>
    </div>
    <div class="card">
      <h3>Panels <span class="sub panels-sub"></span></h3>
      <div class="card-body panels-slot"><div class="muted">Loading…</div></div>
    </div>
    <div class="card">
      <h3>Battery storage <span class="sub batt-sub"></span></h3>
      <div class="card-body batt-slot"><div class="muted">Loading…</div></div>
    </div>
    <div class="card">
      <h3>Devices <span class="sub">${fmt(p.total_capcity).value} ${fmt(p.total_capcity).unit} installed</span></h3>
      <div class="table-scroll devices-slot"><div class="muted pad">Loading…</div></div>
    </div>`;
}

/* ---------------- Weather (Open-Meteo WMO codes) ---------------- */

const WMO = [
  [[0], "☀️", "Clear sky"],
  [[1], "🌤️", "Mainly clear"],
  [[2], "⛅", "Partly cloudy"],
  [[3], "☁️", "Overcast"],
  [[45, 48], "🌫️", "Fog"],
  [[51, 53, 55, 56, 57], "🌦️", "Drizzle"],
  [[61, 63, 65, 66, 67, 80, 81, 82], "🌧️", "Rain"],
  [[71, 73, 75, 77, 85, 86], "❄️", "Snow"],
  [[95, 96, 99], "⛈️", "Thunderstorm"],
];
function wmo(code) {
  for (const [codes, ico, label] of WMO) if (codes.includes(code)) return { ico, label };
  return { ico: "•", label: "Unknown" };
}

/* ---------------- Energy chart (day / month / year) ---------------- */

// Per-plant view state, survives the 60s page refresh.
const energyState = {};
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;

function getEState(psId) {
  if (!energyState[psId]) energyState[psId] = { period: "day", date: new Date() };
  return energyState[psId];
}

function shiftDate(st, dir) {
  const d = new Date(st.date);
  if (st.period === "day") d.setDate(d.getDate() + dir);
  else if (st.period === "month") d.setMonth(d.getMonth() + dir);
  else d.setFullYear(d.getFullYear() + dir);
  if (d > new Date()) return;
  st.date = d;
}

function wireEnergyCard(el, psId) {
  const st = getEState(psId);
  const slot = el.querySelector(".curve-slot");
  const sub = el.querySelector(".curve-max");
  const segBtns = el.querySelectorAll(".seg button");
  const label = el.querySelector(".date-label");
  const input = el.querySelector(".date-input");
  const prev = el.querySelector(".prev"), next = el.querySelector(".next");

  const syncControls = () => {
    segBtns.forEach(b => b.classList.toggle("on", b.dataset.p === st.period));
    const d = st.date;
    if (st.period === "day") {
      label.textContent = `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
      input.type = "date";
      input.value = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      input.style.display = "";
    } else if (st.period === "month") {
      label.textContent = `${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
      input.type = "month";
      input.value = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
      input.style.display = "";
    } else {
      label.textContent = String(d.getFullYear());
      input.style.display = "none";
    }
    const now = new Date();
    next.disabled =
      (st.period === "day" && ymd(d) >= ymd(now)) ||
      (st.period === "month" && d.getFullYear() === now.getFullYear() && d.getMonth() >= now.getMonth()) ||
      (st.period === "year" && d.getFullYear() >= now.getFullYear());
  };

  const reload = () => { syncControls(); loadEnergy(slot, sub, psId, st); };
  segBtns.forEach(b => b.addEventListener("click", () => {
    st.period = b.dataset.p; st.date = new Date(); reload();
  }));
  prev.addEventListener("click", () => { shiftDate(st, -1); reload(); });
  next.addEventListener("click", () => { shiftDate(st, 1); reload(); });
  input.addEventListener("change", () => {
    if (!input.value) return;
    const parts = input.value.split("-").map(Number);
    st.date = new Date(parts[0], (parts[1] ?? 1) - 1, parts[2] ?? 1);
    reload();
  });
  reload();
}

async function loadEnergy(slot, sub, psId, st) {
  slot.innerHTML = '<div class="muted">Loading…</div>';
  sub.textContent = "";
  try {
    if (st.period === "day") {
      const date = ymd(st.date);
      const [curve, flowHist, weather] = await Promise.all([
        getJSON(`/api/plants/${psId}/curve?date=${date}`),
        getJSON(`/api/plants/${psId}/flow/history?date=${date}`).catch(() => null),
        getJSON(`/api/plants/${psId}/weather?date=${date}`).catch(() => null),
      ]);
      renderDayChart(slot, sub, curve, flowHist, weather);
    } else {
      const date = st.period === "month"
        ? `${st.date.getFullYear()}${pad2(st.date.getMonth() + 1)}`
        : String(st.date.getFullYear());
      const data = await getJSON(`/api/plants/${psId}/energy?period=${st.period}&date=${date}`);
      renderAggChart(slot, sub, data, st.period);
    }
  } catch (e) {
    slot.innerHTML = `<div class="error">${e.message}</div>`;
  }
}

const DAY_SERIES = [
  { key: "pv",   label: "Solar",   color: "#eda100" },
  { key: "load", label: "Home",    color: "#3987e5" },
  { key: "grid", label: "Grid (+import / −export)",    color: "#9085e9" },
  { key: "batt", label: "Battery (+charge / −discharge)", color: "#2a9d5c" },
];

function renderDayChart(container, sub, curve, flowHist, weather) {
  const pvSamples = curve?.samples || [];
  const flowSamples = flowHist?.samples || [];
  if (!pvSamples.length && !flowSamples.length) {
    container.innerHTML = '<div class="muted">No data for this day.</div>';
    return;
  }
  const W = 960, H = 280, m = { t: 14, r: 12, b: 26, l: 50 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const toMin = t => +t.slice(0, 2) * 60 + +t.slice(2, 4);

  // Series values indexed by minute-of-day. Grid/battery are signed.
  const byMin = {};
  const put = (t, key, v) => {
    if (v == null) return;
    const x = toMin(t);
    (byMin[x] = byMin[x] || { x })[key] = v;
  };
  pvSamples.forEach(s => put(s.t, "pv", s.w));
  flowSamples.forEach(s => {
    put(s.t, "load", s.load_w);
    put(s.t, "grid", s.grid_w);
    put(s.t, "batt", s.batt_w);
  });
  const pts = Object.values(byMin).sort((a, b) => a.x - b.x);
  const present = DAY_SERIES.filter(s => pts.some(p => p[s.key] != null));

  let hi = 100, lo = 0;
  for (const p of pts) for (const s of present) {
    const v = p[s.key];
    if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); }
  }
  const stepW = hi - lo > 4000 ? 2000 : hi - lo > 2000 ? 1000 : 500;
  const yMax = Math.ceil(hi / stepW) * stepW;
  const yMin = Math.floor(lo / stepW) * stepW;

  const X = v => m.l + (v / 1440) * iw;
  const Y = v => m.t + ih - ((v - yMin) / (yMax - yMin)) * ih;

  let grid = "", ylab = "";
  for (let v = yMin; v <= yMax; v += stepW) {
    const y = Y(v).toFixed(1);
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--hairline)" stroke-width="1"/>`;
    ylab += `<text x="${m.l - 8}" y="${+y + 3.5}" text-anchor="end" font-size="11" fill="var(--muted)">${v / 1000} kW</text>`;
  }
  let xlab = "";
  for (let h = 0; h <= 24; h += 4) {
    xlab += `<text x="${X(h * 60).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${String(h).padStart(2, "0")}:00</text>`;
  }

  // One path per series; gaps where a value is missing.
  const paths = present.map(s => {
    let d = "", pen = false;
    for (const p of pts) {
      const v = p[s.key];
      if (v == null) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${X(p.x).toFixed(1)},${Y(v).toFixed(1)}`;
      pen = true;
    }
    const area = s.key === "pv" && d
      ? `<path d="${d}L${X(pts[pts.length - 1].x).toFixed(1)},${Y(0)}L${X(pts[0].x).toFixed(1)},${Y(0)}Z" fill="${s.color}" opacity="0.08"/>` : "";
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");

  // Weather strip: one icon per 2h slot, centered under the slot it covers.
  let wxRow = "", HS = H;
  const hourly = weather?.hourly;
  if (hourly?.length) {
    HS = H + 30;
    const byHour = Object.fromEntries(hourly.map(x => [x.h, x.code]));
    for (let h = 0; h < 24; h += 2) {
      const code = byHour[h] ?? byHour[h + 1];
      if (code == null) continue;
      const { ico, label } = wmo(code);
      wxRow += `<text x="${X(h * 60 + 60).toFixed(1)}" y="${H + 18}" text-anchor="middle" font-size="14">
        <title>${String(h).padStart(2, "0")}:00–${String(h + 2).padStart(2, "0")}:00 · ${label}</title>${ico}</text>`;
    }
  }

  container.innerHTML = `
    <div class="legend">${present.map(s =>
      `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>
    <div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${HS}" role="img" aria-label="Power for the day">
      ${wxRow}
      ${grid}${ylab}${xlab}
      <line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--baseline)" stroke-width="1"/>
      ${paths}
      <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--baseline)" stroke-width="1" visibility="hidden"/>
    </svg>
    <div class="chart-tip"></div>
  </div>`;

  const wrap = container.querySelector(".chart-wrap");
  const svg = wrap.querySelector("svg");
  const tip = wrap.querySelector(".chart-tip");
  const xh = svg.querySelector(".xh");

  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) * (W / r.width);
    const minute = Math.max(0, Math.min(1440, ((mx - m.l) / iw) * 1440));
    let best = pts[0];
    for (const p of pts) if (Math.abs(p.x - minute) < Math.abs(best.x - minute)) best = p;
    const px = X(best.x);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.style.left = (px / W * r.width) + "px";
    tip.style.top = "10px";
    const hh = pad2(Math.floor(best.x / 60)), mm = pad2(best.x % 60);
    tip.innerHTML = `${hh}:${mm}` + present.map(s => best[s.key] == null ? "" :
      `<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:4px"></i>${s.label.split(" (")[0]} <span class="v">${(best[s.key] / 1000).toFixed(2)} kW</span>`).join("");
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    xh.setAttribute("visibility", "hidden");
  });

  const peak = Math.max(...pts.map(p => p.pv ?? 0), 0);
  sub.textContent = peak > 0 ? `PV peak ${(peak / 1000).toFixed(2)} kW` : "";
}

const AGG_SERIES = [
  { key: "pv",     label: "Solar",    color: "#eda100", bar: true },
  { key: "load",   label: "Home",     color: "#3987e5" },
  { key: "import", label: "Imported", color: "#e34948" },
  { key: "export", label: "Exported", color: "#9085e9" },
];

function renderAggChart(container, sub, data, period) {
  const rows = data.rows || [];
  if (!rows.length) {
    container.innerHTML = '<div class="muted">No data for this period.</div>';
    return;
  }
  const W = 960, H = 280, m = { t: 14, r: 12, b: 26, l: 50 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = rows.length;
  const band = iw / n;
  const Xc = i => m.l + band * (i + 0.5);

  let hi = 1000;
  for (const r of rows) for (const s of AGG_SERIES) hi = Math.max(hi, r[s.key] ?? 0);
  const stepWh = hi > 40000 ? 20000 : hi > 20000 ? 10000 : hi > 8000 ? 5000 : 2000;
  const yMax = Math.ceil(hi / stepWh) * stepWh;
  const Y = v => m.t + ih - (v / yMax) * ih;

  let grid = "", ylab = "";
  for (let v = 0; v <= yMax; v += stepWh) {
    const y = Y(v).toFixed(1);
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--hairline)" stroke-width="1"/>`;
    ylab += `<text x="${m.l - 8}" y="${+y + 3.5}" text-anchor="end" font-size="11" fill="var(--muted)">${v / 1000} kWh</text>`;
  }
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const lab = t => period === "year" ? monthNames[+t - 1] : String(+t);
  const xEvery = period === "year" ? 1 : Math.ceil(n / 16);
  let xlab = "";
  rows.forEach((r, i) => {
    if (i % xEvery === 0) xlab += `<text x="${Xc(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab(r.t)}</text>`;
  });

  const barW = Math.min(24, band * 0.55);
  const bars = rows.map((r, i) => {
    const v = r.pv ?? 0;
    if (v <= 0) return "";
    const y = Y(v);
    return `<rect x="${(Xc(i) - barW / 2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${barW.toFixed(1)}" height="${(Y(0) - y).toFixed(1)}" rx="3" fill="#eda100"/>`;
  }).join("");

  const lines = AGG_SERIES.filter(s => !s.bar).map(s => {
    let d = "", pen = false;
    rows.forEach((r, i) => {
      const v = r[s.key];
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${Xc(i).toFixed(1)},${Y(v).toFixed(1)}`;
      pen = true;
    });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");

  container.innerHTML = `
    <div class="legend">${AGG_SERIES.map(s =>
      `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>
    <div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Energy per ${period === "year" ? "month" : "day"}">
      ${grid}${ylab}${xlab}
      <line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--baseline)" stroke-width="1"/>
      ${bars}${lines}
      <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--baseline)" stroke-width="1" visibility="hidden"/>
    </svg>
    <div class="chart-tip"></div>
  </div>`;

  const wrap = container.querySelector(".chart-wrap");
  const svg = wrap.querySelector("svg");
  const tip = wrap.querySelector(".chart-tip");
  const xh = svg.querySelector(".xh");
  const kwh = v => v == null ? "—" : (v / 1000).toFixed(1) + " kWh";

  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, Math.floor((mx - m.l) / band)));
    const row = rows[i];
    const px = Xc(i);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.style.left = (px / W * r.width) + "px";
    tip.style.top = "10px";
    tip.innerHTML = `<b>${period === "year" ? monthNames[+row.t - 1] : "Day " + +row.t}</b>` +
      AGG_SERIES.map(s => `<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:4px"></i>${s.label} <span class="v">${kwh(row[s.key])}</span>`).join("") +
      `<br>Battery: +${kwh(row.batt_charge)} / −${kwh(row.batt_discharge)}`;
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    xh.setAttribute("visibility", "hidden");
  });

  const tot = k => rows.reduce((a, r) => a + (r[k] ?? 0), 0);
  sub.textContent = `PV ${(tot("pv") / 1000).toFixed(0)} kWh · home ${(tot("load") / 1000).toFixed(0)} kWh · imported ${(tot("import") / 1000).toFixed(0)} kWh · exported ${(tot("export") / 1000).toFixed(0)} kWh`;
}

/* ---------------- Energy flow ---------------- */

const fmtW2 = w => w == null ? "—" : (Math.abs(w) >= 1000 ? (w / 1000).toFixed(2) + " kW" : Math.round(w) + " W");
const fmtKWh = wh => wh == null ? "—" : (wh / 1000).toFixed(1) + " kWh";

function renderFlow(container, sub, f, ev) {
  const soc = f.soc == null ? "—" : (f.soc * 100).toFixed(0) + "%";
  sub.textContent = `battery ${soc}`;
  const evOn = ev && ev.charging && (ev.power_w ?? 0) > 15;

  const pv = Math.max(f.pv_w ?? 0, 0), load = Math.max(f.load_w ?? 0, 0);
  const chg = Math.max(f.batt_charge_w ?? 0, 0), dis = Math.max(f.batt_discharge_w ?? 0, 0);
  const imp = Math.max(f.grid_import_w ?? 0, 0), exp = Math.max(f.grid_export_w ?? 0, 0);

  // Pair-flow split (the API only gives node totals): PV feeds the house
  // first, surplus charges the battery, remainder exports; deficits are
  // covered by battery, then grid.
  const pvToLoad = Math.min(pv, load);
  let pvRem = pv - pvToLoad;
  const pvToBatt = Math.min(pvRem, chg);
  pvRem -= pvToBatt;
  const pvToGrid = Math.min(pvRem, exp);
  const battToLoad = Math.min(dis, load - pvToLoad);
  const gridToLoad = Math.max(load - pvToLoad - battToLoad, 0) > 15 ? Math.min(imp, load - pvToLoad - battToLoad) : 0;
  const gridToBatt = Math.max(chg - pvToBatt, 0);
  const battToGrid = Math.max(exp - pvToGrid, 0);

  // Diamond layout: solar top, grid left, home right, battery bottom;
  // EV hangs below Home when the wall connector reports charging.
  // All paths are quarter-curves that meet smoothly around the center.
  const S = { x: 350, y: 62 }, G = { x: 96, y: 185 }, H = { x: 604, y: 185 }, B = { x: 350, y: 308 };
  const EV = { x: 604, y: 330 };
  const CLR = { sun: "#eda100", batt: "#2a9d5c", grid: "#9085e9", home: "#3987e5", ev: "#e34948" };

  const flows = [
    ...(ev ? [{ w: evOn ? ev.power_w : 0, path: `M ${H.x} ${H.y + 44} L ${EV.x} ${EV.y - 44}`, color: CLR.ev }] : []),
    { w: pvToLoad,   path: `M ${S.x} ${S.y + 38} C ${S.x} 185, ${S.x} 185, ${H.x - 44} 185`, color: CLR.sun },
    { w: pvToBatt,   path: `M ${S.x} ${S.y + 38} L ${B.x} ${B.y - 44}`,                       color: CLR.sun },
    { w: pvToGrid,   path: `M ${S.x} ${S.y + 38} C ${S.x} 185, ${S.x} 185, ${G.x + 44} 185`, color: CLR.sun },
    { w: battToLoad, path: `M ${B.x} ${B.y - 44} C ${B.x} 185, ${B.x} 185, ${H.x - 44} 185`, color: CLR.batt },
    { w: battToGrid, path: `M ${B.x} ${B.y - 44} C ${B.x} 185, ${B.x} 185, ${G.x + 44} 185`, color: CLR.batt },
    { w: gridToLoad, path: `M ${G.x + 44} 185 L ${H.x - 44} 185`,                             color: CLR.grid },
    { w: gridToBatt, path: `M ${G.x + 44} 185 C ${B.x} 185, ${B.x} 185, ${B.x} ${B.y - 44}`, color: CLR.grid },
  ];

  const paths = flows.map((e, i) => {
    const on = e.w > 15;
    // Dot speed scales with power: 0.5 kW ≈ 4s per lap, 5 kW ≈ 1.2s.
    const dur = Math.max(1.2, Math.min(5, 2200 / Math.max(e.w, 80))).toFixed(2);
    const base = `<path d="${e.path}" fill="none" stroke="${on ? e.color : "var(--hairline)"}"
      stroke-width="${on ? 2 : 1.5}" opacity="${on ? 0.55 : 0.6}" stroke-linecap="round"/>`;
    if (!on) return base;
    const dots = [0, 1, 2].map(k => `<circle r="4.5" fill="${e.color}">
      <animateMotion dur="${dur}s" begin="${(-dur * k / 3).toFixed(2)}s" repeatCount="indefinite" path="${e.path}"/>
    </circle>`).join("");
    return base + dots;
  }).join("");

  const battState = chg - dis > 15 ? "Charging" : dis - chg > 15 ? "Discharging" : "Standby";
  const gridState = imp - exp > 15 ? "Importing" : exp - imp > 15 ? "Exporting" : "Standby";

  const node = (n, ico, color, value, l1, l2, labelAbove) => `
    <circle cx="${n.x}" cy="${n.y}" r="38" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/>
    <text x="${n.x}" y="${n.y - 4}" text-anchor="middle" font-size="20">${ico}</text>
    <text x="${n.x}" y="${n.y + 20}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">${value}</text>
    ${labelAbove
      ? `<text x="${n.x}" y="${n.y - 50}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink-2)">${l1}</text>`
      : `<text x="${n.x}" y="${n.y + 58}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink-2)">${l1}</text>
         ${l2 ? `<text x="${n.x}" y="${n.y + 73}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${l2}</text>` : ""}`}`;

  const t = f.today || {};
  const evState = !ev ? "" : evOn ? "Charging" : ev.vehicle_connected ? "Plugged in" : "Disconnected";
  const H_SVG = ev ? 420 : 400;
  container.innerHTML = `
    <div class="chart-wrap">
      <svg viewBox="0 0 700 ${H_SVG}" role="img" aria-label="Energy flow">
        ${paths}
        ${node(S, "☀️", CLR.sun, fmtW2(pv), "Solar", "", true)}
        ${node(G, "⚡", CLR.grid, fmtW2(Math.abs(imp - exp)), "Grid", gridState)}
        ${node(H, "🏠", CLR.home, fmtW2(load), "Home", "", !!ev)}
        ${node(B, "🔋", CLR.batt, fmtW2(Math.abs(chg - dis)), `Battery ${soc}`, battState)}
        ${ev ? node(EV, "🚗", CLR.ev, evOn ? fmtW2(ev.power_w) : "0 W", "EV", evState) : ""}
      </svg>
    </div>
    <div class="flow-today">
      <span>Today: solar <b>${fmtKWh(t.pv_wh)}</b></span>
      <span>home <b>${fmtKWh(t.load_wh)}</b></span>
      <span>imported <b>${fmtKWh(t.import_wh)}</b></span>
      <span>exported <b>${fmtKWh(t.export_wh)}</b></span>
      <span>charged <b>${fmtKWh(t.batt_charge_wh)}</b></span>
      <span>discharged <b>${fmtKWh(t.batt_discharge_wh)}</b></span>
      ${ev?.session_wh != null ? `<span>EV session <b>${fmtKWh(ev.session_wh)}</b></span>` : ""}
    </div>`;
}

/* ---------------- Panels (optimizers) ---------------- */

// Sequential blue ramp, light→dark (light-mode steps / dark-mode steps).
const RAMP_LIGHT = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95"];
const RAMP_DARK  = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#3987e5"];
const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches;

function panelTile(p, i, max, ramp) {
  const w = p.power_w;
  // No device_time at all = the optimizer has never reported to the cloud.
  if (!p.reporting) {
    return `<div class="panel dead"
      title="Panel ${i + 1} · SN ${p.sn ?? "?"} · optimizer is not communicating: no data has ever been received from this unit. Check wiring/pairing or contact the installer.">
      <span class="n">#${i + 1}</span>
      <span class="w">⚠ No data</span>
    </div>`;
  }
  const frac = w == null ? 0 : w / max;
  const idx = Math.min(ramp.length - 1, Math.floor(frac * ramp.length));
  const bg = w == null ? "transparent" : ramp[idx];
  // Ink flips by step luminance: light-mode steps 0-2 are light fills, dark-mode steps 3+ approach mid-blue.
  const dark = isDark() ? idx >= ramp.length : idx >= 3;
  const ink = w == null ? "var(--muted)" : (isDark() ? "#ffffff" : (dark ? "#ffffff" : "#0b0b0b"));
  const kwh = p.total_wh == null ? "—" : (p.total_wh / 1000).toFixed(1);
  const lowConf = p._conf != null && p._conf < 0.1;
  const conf = p._conf != null
    ? ` · string confidence ${p._conf}${lowConf ? " (low — assignment uncertain)" : ""}` : "";
  return `<div class="panel" style="background:${bg};color:${ink}"
    title="Panel ${i + 1} · SN ${p.sn ?? "?"} · now ${w == null ? "—" : w.toFixed(0)} W · lifetime ${kwh} kWh${conf}">
    <span class="n">#${i + 1}${lowConf ? " ≈" : ""}</span>
    <span class="w">${w == null ? "—" : w.toFixed(0)} W</span>
  </div>`;
}

function renderPanels(container, sub, data, strMap) {
  const panels = data.panels || [];
  if (!panels.length) {
    container.innerHTML = '<div class="muted">No optimizers found.</div>';
    return;
  }
  const ramp = isDark() ? RAMP_DARK : RAMP_LIGHT;
  const max = Math.max(...panels.map(p => p.power_w ?? 0), 1);
  const total = panels.reduce((a, p) => a + (p.power_w ?? 0), 0);
  const dead = panels.filter(p => !p.reporting).length;
  sub.textContent = `${panels.length} optimizers · ${(total / 1000).toFixed(2)} kW now`
    + (dead ? ` · ⚠ ${dead} not communicating` : "");

  // Attach the deduced string (if the mapping endpoint returned one).
  const byKey = {};
  (strMap?.panels || []).forEach(m => { byKey[m.ps_key] = m; });
  panels.forEach(p => {
    const m = byKey[p.ps_key];
    p._string = m?.string ?? null;
    p._conf = m?.confidence ?? null;
  });

  if (!strMap) {
    container.innerHTML = `<div class="panel-grid">
      ${panels.map((p, i) => panelTile(p, i, max, ramp)).join("")}
    </div>`;
    return;
  }

  const groups = [
    { label: "String A · MPPT1", panels: [] },
    { label: "String B · MPPT2", panels: [] },
    { label: "Unassigned", panels: [] },
  ];
  panels.forEach((p, i) => {
    const g = p._string === 1 ? 0 : p._string === 2 ? 1 : 2;
    groups[g].panels.push([p, i]);
  });

  container.innerHTML = `
    <div class="deduced-note">String grouping is <b>deduced</b> by correlating each
      panel's power curve with the inverter's two MPPT inputs
      (data from ${strMap.date?.slice(6)}/${strMap.date?.slice(4, 6)}) — the API does not expose the actual wiring.
      Panels marked "≈" have low confidence. Recomputed daily.</div>
    ${groups.filter(g => g.panels.length).map(g => `
      <div class="string-group">
        <div class="string-head">${g.label}
          <span class="muted">· ${g.panels.length} panels
          · ${(g.panels.reduce((a, [p]) => a + (p.power_w ?? 0), 0) / 1000).toFixed(2)} kW now</span></div>
        <div class="panel-grid">
          ${g.panels.map(([p, i]) => panelTile(p, i, max, ramp)).join("")}
        </div>
      </div>`).join("")}`;
}

/* ---------------- Batteries ---------------- */

function renderBatteries(container, sub, data) {
  const batts = data.batteries || [];
  if (!batts.length) {
    container.innerHTML = '<div class="muted">No batteries found.</div>';
    return;
  }
  const sys = data.system;
  if (sys) sub.textContent = `system SOH ${pct(sys.soh)}%`;

  const capWh = sys?.capacity_wh;                     // total pack capacity
  const unitWh = capWh ? capWh / batts.length : null; // per battery
  const stored = (soc, cap) =>
    (soc == null || cap == null) ? null :
    `${(soc * cap / 1000).toFixed(1)} of ${(cap / 1000).toFixed(1)} kWh stored`;

  const sysHTML = sys ? `<div class="batt-system">
      <div>
        <div class="label">System state of charge</div>
        <div class="big">${pct(sys.soc)}<span class="pct"> %</span></div>
        <div class="meter" style="width:220px"><div class="fill" style="width:${(sys.soc * 100).toFixed(1)}%"></div></div>
        <div class="stored">${stored(sys.soc, capWh) ?? ""}</div>
      </div>
    </div>` : "";

  container.innerHTML = sysHTML + `<div class="batt-grid">
    ${batts.map(b => `<div class="batt">
      <div class="name">${b.name ?? b.sn}</div>
      <div class="soc-row"><span class="soc">${pct(b.soc)}</span><span class="pct">% SOC</span></div>
      <div class="meter"><div class="fill" style="width:${b.soc == null ? 0 : (b.soc * 100).toFixed(1)}%"></div></div>
      <div class="stored">${stored(b.soc, unitWh) ?? ""}</div>
      <div class="meta">
        Health ${pct(b.soh)}% · ${b.temp_c == null ? "—" : b.temp_c.toFixed(1)} °C<br>
        ${b.voltage == null ? "—" : b.voltage.toFixed(1)} V · ${b.current == null ? "—" : b.current.toFixed(1)} A
      </div>
    </div>`).join("")}
  </div>`;
}

/* ---------------- Devices ---------------- */

async function loadDevices(psId, container) {
  try {
    const data = await getJSON(`/api/plants/${psId}/devices`);
    const list = data.pageList || data.list || [];
    if (!list.length) {
      container.innerHTML = '<div class="muted pad">No devices.</div>';
      return;
    }
    container.innerHTML = `<table>
      <tr><th>Name</th><th>Type</th><th>Model</th><th>Serial number</th><th>Status</th></tr>
      ${list.map(d => {
        const on = d.dev_status === "1";
        return `<tr>
          <td>${d.device_name ?? ""}</td>
          <td>${d.type_name ?? d.device_type ?? ""}</td>
          <td>${d.device_model_code ?? ""}</td>
          <td class="sn">${d.device_sn ?? ""}</td>
          <td><span class="status${on ? "" : " off"}"><span class="dot"></span>${on ? "Online" : "Offline"}</span></td>
        </tr>`;
      }).join("")}
    </table>`;
  } catch (e) {
    container.innerHTML = `<div class="error" style="margin:0.8rem 1.1rem">${e.message}</div>`;
  }
}

/* ---------------- Page assembly ---------------- */

function loadSection(url, render, slot, ...extra) {
  getJSON(url)
    .then(data => render(slot, ...extra, data))
    .catch(e => { slot.innerHTML = `<div class="error">${e.message}</div>`; });
}

async function refresh() {
  const app = document.getElementById("app");
  try {
    const data = await getJSON("/api/plants");
    const plants = data.pageList || data.list || [];
    if (!plants.length) { app.innerHTML = "No plants found on this account."; return; }

    app.className = "";
    app.innerHTML = "";
    let first = true;
    for (const p of plants) {
      const el = document.createElement("div");
      el.className = "plant";
      el.innerHTML = plantHTML(p);
      app.appendChild(el);
      const isFirst = first;
      const evP = getJSON("/api/ev").catch(() => null);
      wireEnergyCard(el, p.ps_id);
      if (isFirst) {
        getJSON(`/api/plants/${p.ps_id}/weather`).then(weather => {
          if (weather?.current?.code != null) {
            const { ico, label } = wmo(weather.current.code);
            const t = weather.current.temp_c;
            document.getElementById("wx-now").innerHTML =
              `<span class="ico" title="${label}">${ico}</span>${t == null ? "" : t.toFixed(0) + " °C"}`;
          }
        }).catch(() => {});
      }
      const flowSlot = el.querySelector(".flow-slot");
      Promise.all([getJSON(`/api/plants/${p.ps_id}/flow`), evP])
        .then(([flow, ev]) => renderFlow(flowSlot, el.querySelector(".flow-sub"), flow, ev))
        .catch(e => { flowSlot.innerHTML = `<div class="error">${e.message}</div>`; });
      const panelsSlot = el.querySelector(".panels-slot");
      const stringsP = getJSON(`/api/plants/${p.ps_id}/strings`).catch(() => null);
      Promise.all([getJSON(`/api/plants/${p.ps_id}/panels`), stringsP])
        .then(([panels, strMap]) =>
          renderPanels(panelsSlot, el.querySelector(".panels-sub"), panels, strMap))
        .catch(e => { panelsSlot.innerHTML = `<div class="error">${e.message}</div>`; });
      loadSection(`/api/plants/${p.ps_id}/batteries`, renderBatteries,
        el.querySelector(".batt-slot"), el.querySelector(".batt-sub"));
      loadDevices(p.ps_id, el.querySelector(".devices-slot"));
      first = false;
    }
    document.getElementById("updated").textContent =
      "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    app.className = "";
    app.innerHTML = `<div class="error">Failed to load plants:\n${e.message}</div>`;
  }
}

refresh();
setInterval(refresh, 60_000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
