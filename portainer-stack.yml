# Portainer stack for Sungrow Solar Dashboard.
# Pulls the prebuilt multi-arch image (amd64 / arm64) from GHCR.
# Set as stack environment variables: ISC_APPKEY, ISC_ACCESS_KEY,
# ISC_USERNAME, ISC_PASSWORD, DASH_USER, DASH_PASSWORD, DASH_DOMAIN.
# Adjust the Traefik network name ("reverse-proxy" below) and the
# entrypoint/certresolver names to match your Traefik instance.

services:
  dashboard:
    image: ghcr.io/phdevpro/sungrow-solar-dashboard:latest
    environment:
      ISC_GATEWAY: https://gateway.isolarcloud.eu
      ISC_APPKEY: ${ISC_APPKEY}
      ISC_ACCESS_KEY: ${ISC_ACCESS_KEY}
      ISC_USERNAME: ${ISC_USERNAME}
      ISC_PASSWORD: ${ISC_PASSWORD}
      ISC_DB_PATH: /data/solar.db
      DASH_USER: ${DASH_USER}
      DASH_PASSWORD: ${DASH_PASSWORD}
      # Shared secret for the home twc-agent (Tesla Wall Connector push);
      # leave empty if you don't use the agent.
      EV_INGEST_TOKEN: ${EV_INGEST_TOKEN}
    volumes:
      - solar_data:/data
    networks:
      - reverse-proxy   # ingress from Traefik
      - egress          # plain bridge for outbound internet (API calls)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"

      # HTTPS router (Let's Encrypt)
      - "traefik.http.routers.solar.rule=Host(`${DASH_DOMAIN}`)"
      - "traefik.http.routers.solar.entrypoints=websecure"
      - "traefik.http.routers.solar.tls=true"
      - "traefik.http.routers.solar.tls.certresolver=letsencrypt"
      - "traefik.http.services.solar.loadbalancer.server.port=8000"

      # HTTP → HTTPS redirect
      - "traefik.http.routers.solar-http.rule=Host(`${DASH_DOMAIN}`)"
      - "traefik.http.routers.solar-http.entrypoints=web"
      - "traefik.http.routers.solar-http.middlewares=solar-redirect"
      - "traefik.http.middlewares.solar-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.solar-redirect.redirectscheme.permanent=true"
    restart: unless-stopped

networks:
  reverse-proxy:
    external: true
  egress:
    driver: bridge

volumes:
  solar_data:
